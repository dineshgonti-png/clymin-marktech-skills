# ============================================================
# BRAND MEMORY CONFIGURATION — EXAMPLE
# This is a fully filled-in example using a fictional company.
# Copy this to brand.yaml and replace with your own details.
# ============================================================

business:
  name: "TechHire Labs"
  legal_entity: "TechHire Labs Inc."
  tagline: "Engineering talent, delivered."
  tagline_alt: "The smarter way to hire engineers."
  description: >
    TechHire Labs is an AI-powered recruitment agency that specializes in
    placing engineering talent at startups and scale-ups. We combine machine
    learning sourcing with hands-on technical screening to deliver candidates
    who ship code from day one.
  positioning: "We are the go-to hiring partner for engineering-led companies that refuse to compromise on talent quality."
  founded: 2022
  employee_count: "25-75"
  experience: "15+ years of combined engineering recruitment and talent operations experience"
  website: "https://www.techhirelabs.com"
  email: "hello@techhirelabs.com"
  booking_link: "https://calendly.com/techhirelabs/intro"

founders:
  - name: "Jordan McAllister"
    role: "Co-founder & CEO"
    linkedin: "https://www.linkedin.com/in/jordanmcallister/"
  - name: "Priya Chakraborty"
    role: "Co-founder & CTO"
    linkedin: "https://www.linkedin.com/in/priyachakraborty/"

values:
  - name: "Precision"
    description: "Every hire matters. We screen ruthlessly so our clients never have to."
  - name: "Speed"
    description: "Engineering teams can't wait months. We close roles in days, not quarters."
  - name: "Transparency"
    description: "No hidden fees, no ghosting, no inflated candidate counts. Just honest recruiting."

locations:
  primary:
    - city: "Austin"
      country: "USA"
      address: "400 West 2nd Street, Suite 310, Austin, TX 78701"
    - city: "London"
      country: "UK"
      address: "71 Queen Victoria Street, London EC4V 4AY"
  service_regions:
    - "North America (US and Canada)"
    - "Europe (UK, Germany, Netherlands, Nordics)"
    - "Remote-first companies (global)"

# ============================================================
# CORE DIFFERENTIATOR — USE IN ALL CONTENT
# ============================================================
differentiator:
  name: "Triple-Screen Process"
  description: >
    Every candidate passes three independent evaluations before reaching a
    client: an AI skills assessment, a live coding session with a senior
    engineer, and a culture-fit interview with a trained behavioral assessor.
    Only candidates who clear all three screens make the shortlist.
  proof_points:
    - metric: "95%"
      label: "Offer Acceptance Rate"
      meaning: "95 out of 100 candidates who receive offers accept them"
      display_in_metrics_bar: true
    - metric: "2:1"
      label: "Interview-to-Hire Ratio"
      meaning: "Clients hire 1 out of every 2 candidates we present"
      display_in_metrics_bar: true
    - metric: "8x"
      label: "Faster AI Sourcing"
      meaning: "Our AI identifies qualified candidates 8x faster than manual sourcing"
      display_in_metrics_bar: true
    - metric: "14 Days"
      label: "Average Time to Close"
      meaning: "From intake call to signed offer in under two weeks"
      display_in_metrics_bar: true

# ============================================================
# PROCESS — YOUR WORKFLOW STEPS
# ============================================================
process:
  - step: 1
    name: "Intake & Role Calibration"
    detail: >
      A 60-minute deep-dive with the hiring manager and eng lead to define
      the role, tech stack, team culture, and non-negotiable skills. We build
      a calibrated scorecard before sourcing begins.
  - step: 2
    name: "AI-Powered Sourcing"
    detail: >
      Our proprietary engine scans GitHub, LinkedIn, Stack Overflow, and 15+
      niche communities to build a longlist scored on technical depth, career
      trajectory, and role fit.
  - step: 3
    name: "Triple-Screen Evaluation"
    detail: >
      Candidates complete an AI skills assessment, a live coding session with
      one of our senior engineers, and a behavioral interview. Only those who
      pass all three screens advance.
  - step: 4
    name: "Shortlist Delivery & Offer Support"
    detail: >
      Client receives 3-5 thoroughly vetted candidates with detailed
      assessment reports. We manage scheduling, offer negotiation, and
      onboarding coordination through day one.

# ============================================================
# SERVICES
# ============================================================
services:
  - name: "Engineering Recruitment"
    description: "End-to-end hiring for software engineers, from junior to staff level"
    typical_roles: ["Backend Engineers", "Frontend Engineers", "Full-Stack Developers", "Mobile Engineers", "DevOps Engineers"]

  - name: "Engineering Leadership Search"
    description: "Executive-level search for technical leaders who can build and scale teams"
    typical_roles: ["VP Engineering", "CTO", "Engineering Director", "Principal Engineer", "Head of Platform"]

  - name: "AI & Data Team Building"
    description: "Specialized recruitment for machine learning, data science, and AI infrastructure roles"
    typical_roles: ["ML Engineers", "Data Scientists", "MLOps Engineers", "AI Researchers", "Data Engineers"]

  - name: "Embedded Recruiting"
    description: "A TechHire Labs recruiter works inside your team on a monthly retainer to handle ongoing hiring needs"
    typical_roles: ["Any engineering role", "Ongoing monthly mandate", "Typically 3-6 month engagement"]

# ============================================================
# TARGET SEGMENTS (in priority order for content)
# ============================================================
target_segments:
  - priority: 1
    name: "Series A Startups"
    key: "series-a"
    description: >
      Seed to Series A startups making their first 5-20 engineering hires.
      Founders are deeply involved in hiring decisions and need a partner
      who understands the urgency and constraints of early-stage building.
    buyer_titles: ["CTO", "Founder/CEO", "VP Engineering", "Head of Engineering"]
    pain_points:
      - "Founders spending 40% of their time recruiting instead of building product"
      - "Can't compete with FAANG compensation packages"
      - "No internal recruiting team or employer brand"
      - "First engineering manager hire is make-or-break"
      - "Need senior engineers who can operate without heavy process"
    keywords_seed:
      - "startup recruitment agency Austin"
      - "hire engineers for Series A startup"
      - "engineering recruitment agency for startups"
      - "how to hire first engineers startup"
      - "startup technical recruiter"

  - priority: 2
    name: "Scale-ups (Series B-D)"
    key: "scale-up"
    description: >
      Series B through D companies scaling from 50 to 500+ engineers. Internal
      recruiting is overwhelmed. Need a partner who can maintain quality bar
      while ramping hiring velocity significantly.
    buyer_titles: ["VP Engineering", "Head of Talent", "CTO", "Director of Engineering"]
    pain_points:
      - "Internal recruiters are at capacity and can't scale fast enough"
      - "Quality of hire drops as hiring volume increases"
      - "Specialized roles (ML, infra, security) sit open for months"
      - "High candidate dropout rate between offer and start date"
      - "Need to hire across multiple locations and time zones"
    keywords_seed:
      - "scale-up engineering recruitment"
      - "hire engineers fast Series B"
      - "technical recruitment agency for growing companies"
      - "bulk engineering hiring without losing quality"
      - "embedded recruiting for scale-ups"

  - priority: 3
    name: "Mid-Market Enterprise"
    key: "enterprise"
    description: >
      Established technology companies (500-5000 employees) with ongoing
      engineering hiring needs. Typically have internal TA teams but need
      agency support for hard-to-fill or surge roles.
    buyer_titles: ["Director of Talent Acquisition", "CHRO", "SVP Engineering", "Hiring Manager"]
    pain_points:
      - "Traditional agencies send too many unqualified resumes"
      - "Niche roles (staff engineer, principal, platform) go unfilled for quarters"
      - "Need agency that understands technical depth, not just keyword matching"
      - "Compliance and structured interview process requirements"
      - "Looking for a long-term strategic partner, not transactional placements"
    keywords_seed:
      - "enterprise engineering recruitment agency"
      - "IT staffing company Austin Texas"
      - "technical recruitment agency London UK"
      - "hire staff engineers enterprise"
      - "recruitment partner for technology companies"

# ============================================================
# TARGET INDUSTRIES
# ============================================================
target_industries:
  - "SaaS & Cloud Software"
  - "Fintech & Financial Services"
  - "Health Tech & Digital Health"
  - "AI & Machine Learning"
  - "Developer Tools & Infrastructure"
  - "E-commerce & Marketplace"

# ============================================================
# BRAND VOICE
# ============================================================
brand_voice:
  tone: "Professional but approachable. Direct and data-driven. Confident without being salesy."
  personality: "Like a sharp engineering manager who moonlights as a recruiter — technically fluent, no-nonsense, and genuinely helpful."

  do:
    - "Use specific numbers and metrics (95% acceptance rate, 14-day close, 2:1 ratio)"
    - "Reference the Triple-Screen Process as a unique differentiator"
    - "Speak to pain points directly — name the problem before offering the solution"
    - "Use 'we' and 'our team' — personal, not corporate"
    - "Include market-specific context (US visa sponsorship, UK right-to-work, remote compensation bands)"
    - "Position AI as a tool that accelerates human judgment, never replaces it"

  dont:
    - "Use corporate jargon (synergy, leverage, ecosystem, paradigm, holistic)"
    - "Make vague claims without proof points"
    - "Sound like every other recruitment agency"
    - "Overpromise about AI capabilities"
    - "Badmouth competitors by name"
    - "Use excessive exclamation marks or hype language"

  sample_phrasing:
    bad: "We leverage cutting-edge AI to holistically transform the talent acquisition ecosystem."
    good: "Most recruitment is keyword matching with extra steps. We built TechHire Labs to actually evaluate whether someone can do the job."

