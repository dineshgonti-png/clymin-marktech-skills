# ============================================================
# PRICING (internal reference — do NOT publish exact numbers)
# ============================================================
pricing:
  model: "Retained search with milestone payments"
  note: "Do NOT publish exact fee percentages in content. Use 'transparent, milestone-based pricing' and direct readers to a consultation call."
  content_approach: >
    When pricing comes up in content, acknowledge that retained search
    fees typically range 20-30% of first-year salary, position TechHire Labs
    as offering a milestone-based structure that aligns incentives, and
    always direct to a conversation for custom quotes.

# ============================================================
# CONTENT INFRASTRUCTURE
# ============================================================
content_config:
  subdirectory: "/resources"
  base_url: "https://www.techhirelabs.com/resources"
  page_types:
    - type: "landing-page"
      label: "Services"
      description: "Explore our solutions by role type and region"
      purpose: "High-intent commercial queries (e.g., 'engineering recruitment agency Austin')"
      target_count: 30
    - type: "blog-post"
      label: "Blog"
      description: "Hiring strategies, salary data, and market insights"
      purpose: "Informational queries (e.g., 'how to hire engineers at a Series A startup')"
      target_count: 35
    - type: "guide"
      label: "Guides"
      description: "Comprehensive playbooks for engineering hiring"
      purpose: "Long-form resources (e.g., 'complete guide to scaling an engineering team')"
      target_count: 8
    - type: "faq"
      label: "FAQs"
      description: "Quick answers to common hiring questions"
      purpose: "Question-based queries (e.g., 'how long does it take to hire a senior engineer')"
      target_count: 10
    - type: "comparison"
      label: "Comparisons"
      description: "Side-by-side analysis to help you choose"
      purpose: "vs queries (e.g., 'in-house recruiter vs recruitment agency for startups')"
      target_count: 7

