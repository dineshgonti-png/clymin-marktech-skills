# ============================================================
# BRAND VOICE
# ============================================================
brand_voice:
  tone: "Confident, professional, results-oriented"
  personality: "Strategic partner who speaks with authority about data and AI, accessible without being overly technical"
  do:
    - "Lead with business outcomes and specific metrics"
    - "Use exact numbers: 99.2% accuracy, 48-hour setup, from $100"
    - "Position Clymin as a strategic partner, not just a vendor"
    - "Emphasize the AI-agentic advantage over static scrapers"
    - "Mention compliance certifications (ISO 27001, SOC 2, GDPR) where relevant"
    - "Use plain business language: track, extract, deliver, monitor, analyze"
    - "Name the cost of inaction: 'competitors updating prices hourly while you check weekly'"
  dont:
    - "Use AI vocabulary: delve, foster, leverage, empower, unlock, supercharge, dive into"
    - "Make generic claims without backing them with data"
    - "Sound like a commodity scraping tool — Clymin is a fully managed service"
    - "Downplay compliance — it is a key differentiator"
    - "Use tentative language: 'may help', 'can potentially', 'might be able to'"
    - "Start paragraphs with 'This', 'It', 'These', 'As mentioned above'"
    - "Use standalone 'Trusted by 200+ clients' boilerplate — weave into context"
  sample_phrasing:
    bad: "We can help you get some data from websites if you need it."
    good: "Clymin's AI agents extract, cleanse, and deliver structured data from any source — so your team focuses on decisions, not data collection."
    bad2: "Unlock infinite possibilities with AI-powered data scraping."
    good2: "Track competitor prices across 10,000+ SKUs — updated daily, delivered clean."

