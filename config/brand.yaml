      - "CEO"

# ============================================================
# TARGET SEGMENTS (in priority order)
# ============================================================
target_segments:
  - priority: 1
    name: "E-Commerce Companies"
    key: "ecommerce"
    description: >
      Online retailers and marketplace operators who need competitive pricing data,
      product catalog monitoring, and market trend analysis at scale.
    buyer_titles:
      - "Head of E-Commerce"
      - "Pricing Manager"
      - "Marketing Manager"
      - "CEO"
    pain_points:
      - "Manual competitor price monitoring is too slow and error-prone"
      - "Can't track thousands of SKUs across competitors in real time"
      - "Missing market trends and pricing opportunities"
      - "Data from multiple sources is unstructured and unusable"
    keywords_seed:
      - "web scraping services for ecommerce"
      - "competitor price monitoring"
      - "product data extraction"
      - "ecommerce data scraping"
      - "price intelligence services"
  - priority: 2
    name: "Travel & Hospitality"
    key: "travel"
    description: >
      Hotels, OTAs, and travel companies that need real-time rate monitoring,
      availability tracking, and competitive intelligence across booking platforms.
    buyer_titles:
      - "Revenue Manager"
      - "CEO"
      - "Head of Distribution"
    pain_points:
      - "Competitor rates change constantly and manually tracking is impossible"
      - "Missing revenue optimization opportunities due to stale data"
      - "No visibility into competitor availability and pricing strategies"
    keywords_seed:
      - "hotel rate scraping"
      - "travel data extraction"
      - "OTA price monitoring"
      - "hospitality competitive intelligence"
  - priority: 3
    name: "Real Estate"
    key: "real-estate"
    description: >
      Real estate firms, proptech companies, and consultants who need property
      listing data, market analytics, and pricing intelligence.
    buyer_titles:
      - "Real Estate Consultant"
      - "Data Analyst"
      - "Head of Research"
    pain_points:
      - "Property listings are scattered across dozens of platforms"
      - "Market data is stale by the time it's manually compiled"
      - "Can't scale data collection to cover full markets"
    keywords_seed:
      - "real estate data scraping"
      - "property listing extraction"
      - "real estate market intelligence"
      - "proptech data services"
  - priority: 4
    name: "Food & Quick Commerce"
    key: "food-delivery"
    description: >
      Food delivery platforms, restaurant chains, and quick commerce operators who
      need menu data, pricing intelligence, and delivery performance monitoring.
    buyer_titles:
      - "Product Manager"
      - "Strategy Director"
      - "Head of Growth"
    pain_points:
      - "Competitor menus and pricing change daily"
      - "No automated way to track delivery coverage and performance"
      - "Difficult to benchmark against competitors at scale"
    keywords_seed:
      - "food delivery data scraping"
      - "restaurant data extraction"
      - "quick commerce competitive intelligence"
      - "menu price monitoring"
  - priority: 5
    name: "Financial Services"
    key: "financial"
    description: >
      Financial analysts, hedge funds, and fintech companies seeking alternative
      data sources for market analysis and investment decisions.
    buyer_titles:
      - "Financial Analyst"
      - "Quantitative Researcher"
      - "Head of Alternative Data"
    pain_points:
      - "Need alternative data sources beyond traditional financial feeds"
      - "Manual data collection can't keep pace with market movements"
      - "Data quality and compliance are critical concerns"
    keywords_seed:
      - "alternative data extraction"
      - "financial data scraping services"
      - "market data collection"
      - "web scraping for finance"

