    typical_roles:
      - "Data Engineer"
      - "Business Analyst"
      - "Marketing Manager"
  - name: "Mobile App Scraping Services"
    description: "Dedicated mobile app data extraction for competitive intelligence"
    typical_roles:
      - "Product Manager"
      - "Market Researcher"
  - name: "Real-Time Crawling Services"
    description: "Continuous, real-time data collection for always-fresh insights"
    typical_roles:
      - "Pricing Analyst"
      - "Operations Manager"
  - name: "API Solutions"
    description: "Custom APIs for seamless data integration into your existing workflows"
    typical_roles:
      - "Data Engineer"
      - "CTO"
  - name: "Data Cleansing & Transformation"
    description: "Cleaning, structuring, and preparing raw data for analysis and decision-making"
