  - "Grocery & Retail"

# ============================================================
# BRAND VOICE
# ============================================================
brand_voice:
  tone: "Confident, professional, results-oriented"
  personality: "Strategic partner who speaks with authority about data and AI, accessible without being overly technical"
  do:
    - "Lead with business outcomes and metrics"
    - "Use specific numbers and percentages to demonstrate impact"
    - "Position Clymin as a strategic partner, not just a vendor"
    - "Emphasize the AI-agentic advantage over static scrapers"
    - "Mention compliance and security certifications where relevant"
    - "Use action-oriented language — anticipate, supercharge, unlock, empower"
  dont:
    - "Use overly technical jargon without explaining business value"
    - "Make generic claims without backing them with data"
    - "Sound like a commodity scraping tool — we are a managed service"
    - "Downplay compliance — it is a key differentiator"
    - "Use passive or tentative language — be direct and confident"
  sample_phrasing:
    bad: "We can help you get some data from websites if you need it."
    good: "Clymin's AI agents extract, cleanse, and deliver structured data from any source — so you can focus on decisions, not data collection."

