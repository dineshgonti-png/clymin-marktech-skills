# ============================================================
# BRAND MEMORY CONFIGURATION — Clymin
# ============================================================

business:
  name: "Clymin"
  legal_entity: "Clymin"
  tagline: "Supercharge Your Business With AI-Agentic Scraping Services"
  tagline_alt: "Unlock Infinite Possibilities With AI-Powered Data Scraping"
  description: >
    Clymin is an AI-powered managed web and mobile app scraping service that extracts,
    cleanses, and transforms data into actionable, real-time datasets. Our intelligent
    AI agents empower businesses to make smarter decisions with structured, ready-to-use data.
  positioning: "AI-agentic data extraction partner that delivers clean, structured, real-time data at scale"
  founded: 2012
  employee_count: "50-200"
  experience: "12+ years of experience in data extraction and web scraping"
  website: "https://www.clymin.ai"
  email: "contact@clymin.com"
  booking_link: "https://calendar.app.google/Ar5bkNN4nZpumJxN9"

founders:
  - name: "Dinesh"
    role: "Founder"
    linkedin: "https://www.linkedin.com/company/clymin"

values:
  - name: "Strategic Partnership"
    description: "We are not just a service provider — we are a strategic partner committed to unlocking data for growth and innovation."
  - name: "Innovation"
    description: "AI-agentic technology that learns and adapts to deliver unparalleled accuracy."
  - name: "Compliance & Security"
    description: "ISO 27001 certified, AICPA SOC compliant, and GDPR ready — your data is handled with the highest security standards."
  - name: "Results-Driven"
    description: "Every engagement is measured by the business impact we deliver to our clients."

locations:
  primary:
    - city: "San Francisco"
      country: "United States"
      address: "505 Montgomery Street, 11th Floor, San Francisco, CA 94111"
    - city: "Hyderabad"
      country: "India"
      address: "4th Floor, Serenity Square, Hyderabad, Telangana 500081"
  service_regions:
    - "United States"
    - "India"
    - "Global"

# ============================================================
# CORE DIFFERENTIATOR
# ============================================================
differentiator:
  name: "AI-Agentic Scraping"
  description: >
    Clymin uses intelligent AI agents that learn and adapt — not static scrapers.
    Our fully managed, end-to-end service handles setup, maintenance, and delivery
    so you get clean, structured, real-time data without any technical overhead.
  proof_points:
    - metric: "200+"
      label: "Clients Served"
      meaning: "Trusted by over 200 businesses across industries"
      display_in_metrics_bar: true
    - metric: "750+"
      label: "Projects Delivered"
      meaning: "Successfully completed over 750 data extraction projects"
      display_in_metrics_bar: true
    - metric: "12+"
      label: "Years Experience"
      meaning: "Over a decade of expertise in web scraping and data extraction"
      display_in_metrics_bar: true
    - metric: "100B+"
      label: "Data Points Extracted"
      meaning: "Over 100 billion data points extracted and delivered"
      display_in_metrics_bar: true

# ============================================================
# PROCESS
# ============================================================
process:
  - step: 1
    name: "Initial Consultation"
    detail: >
      We understand your data requirements, target sources, and business goals
      to design a custom extraction strategy.
  - step: 2
    name: "Custom Scraping Setup"
    detail: >
      Our AI agents are configured and deployed to extract data from your
      specified web and mobile app sources with precision.
  - step: 3
    name: "Data Delivery & Maintenance"
    detail: >
      Clean, structured datasets are delivered on your schedule. We handle
      ongoing maintenance, anti-blocking, and source changes automatically.

# ============================================================
# SERVICES
# ============================================================
services:
  - name: "Web & App Scraping AI Services"
    description: "AI-driven data extraction from websites and mobile applications"
    typical_roles:
      - "Data Engineer"
      - "Business Analyst"
      - "Marketing Manager"
  - name: "Mobile App Scraping Services"
    description: "Dedicated mobile app data extraction for competitive intelligence"
    typical_roles:
      - "Product Manager"
      - "Market Researcher"
  - name: "Real-Time Crawling Services"
    description: "Continuous, real-time data collection for always-fresh insights"
    typical_roles:
      - "Pricing Analyst"
      - "Operations Manager"
  - name: "API Solutions"
    description: "Custom APIs for seamless data integration into your existing workflows"
    typical_roles:
      - "Data Engineer"
      - "CTO"
  - name: "Data Cleansing & Transformation"
    description: "Cleaning, structuring, and preparing raw data for analysis and decision-making"
    typical_roles:
      - "Data Scientist"
      - "Business Intelligence Analyst"
  - name: "Automated Monitoring"
    description: "Ongoing automated alerts for critical market updates and competitor changes"
    typical_roles:
      - "Strategy Director"
      - "CEO"

# ============================================================
# TARGET SEGMENTS (in priority order)
# ============================================================
target_segments:
  - priority: 1
    name: "E-Commerce Companies"
    key: "ecommerce"
    description: >
      Online retailers and marketplace operators who need competitive pricing data,
      product catalog monitoring, and market trend analysis at scale.
    buyer_titles:
      - "Head of E-Commerce"
      - "Pricing Manager"
      - "Marketing Manager"
      - "CEO"
    pain_points:
      - "Manual competitor price monitoring is too slow and error-prone"
      - "Can't track thousands of SKUs across competitors in real time"
      - "Missing market trends and pricing opportunities"
      - "Data from multiple sources is unstructured and unusable"
    keywords_seed:
      - "web scraping services for ecommerce"
      - "competitor price monitoring"
      - "product data extraction"
      - "ecommerce data scraping"
      - "price intelligence services"
  - priority: 2
    name: "Travel & Hospitality"
    key: "travel"
    description: >
      Hotels, OTAs, and travel companies that need real-time rate monitoring,
      availability tracking, and competitive intelligence across booking platforms.
    buyer_titles:
      - "Revenue Manager"
      - "CEO"
      - "Head of Distribution"
    pain_points:
      - "Competitor rates change constantly and manually tracking is impossible"
      - "Missing revenue optimization opportunities due to stale data"
      - "No visibility into competitor availability and pricing strategies"
    keywords_seed:
      - "hotel rate scraping"
      - "travel data extraction"
      - "OTA price monitoring"
      - "hospitality competitive intelligence"
  - priority: 3
    name: "Real Estate"
    key: "real-estate"
    description: >
      Real estate firms, proptech companies, and consultants who need property
      listing data, market analytics, and pricing intelligence.
    buyer_titles:
      - "Real Estate Consultant"
      - "Data Analyst"
      - "Head of Research"
    pain_points:
      - "Property listings are scattered across dozens of platforms"
      - "Market data is stale by the time it's manually compiled"
      - "Can't scale data collection to cover full markets"
    keywords_seed:
      - "real estate data scraping"
      - "property listing extraction"
      - "real estate market intelligence"
      - "proptech data services"
  - priority: 4
    name: "Food & Quick Commerce"
    key: "food-delivery"
    description: >
      Food delivery platforms, restaurant chains, and quick commerce operators who
      need menu data, pricing intelligence, and delivery performance monitoring.
    buyer_titles:
      - "Product Manager"
      - "Strategy Director"
      - "Head of Growth"
    pain_points:
      - "Competitor menus and pricing change daily"
      - "No automated way to track delivery coverage and performance"
      - "Difficult to benchmark against competitors at scale"
    keywords_seed:
      - "food delivery data scraping"
      - "restaurant data extraction"
      - "quick commerce competitive intelligence"
      - "menu price monitoring"
  - priority: 5
    name: "Financial Services"
    key: "financial"
    description: >
      Financial analysts, hedge funds, and fintech companies seeking alternative
      data sources for market analysis and investment decisions.
    buyer_titles:
      - "Financial Analyst"
      - "Quantitative Researcher"
      - "Head of Alternative Data"
    pain_points:
      - "Need alternative data sources beyond traditional financial feeds"
      - "Manual data collection can't keep pace with market movements"
      - "Data quality and compliance are critical concerns"
    keywords_seed:
      - "alternative data extraction"
      - "financial data scraping services"
      - "market data collection"
      - "web scraping for finance"

