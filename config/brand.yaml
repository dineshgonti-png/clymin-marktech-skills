# ============================================================
# PRICING
# ============================================================
pricing:
  model: "Use-case based pricing — scales with data volume, source complexity, and delivery frequency"
  starting_from: "$100 per project"
  ranges:
    small_project: "From $100 — single source, one-time or infrequent extraction"
    monthly_monitoring: "$500–$2,000/month — continuous monitoring, 1–5 sources, standard delivery"
    mid_market: "$2,000–$10,000/month — multi-source, daily delivery, custom API"
    enterprise: "$10,000+/month — high-volume, real-time, dedicated infrastructure"
  note: "Exact pricing depends on: number of sources, data volume, delivery frequency, cleaning requirements. Free consultation determines the right plan."
  content_approach: >
    Always mention "starting from $100" to signal accessibility. Frame pricing as ROI:
    "$500/month vs. a $50,000 pricing mistake" or "less than the cost of one analyst day per week."
    Never publish exact enterprise pricing — always CTA to free consultation.
    Use the in-content comparison table (Clymin vs In-house vs DIY tools) on all landing pages.
  comparison_table:
    - approach: "Clymin Managed Service"
      setup: "48 hours"
      maintenance: "Zero — fully managed"
      accuracy: "99%+"
      starting_cost: "From $100"
    - approach: "In-house engineering team"
      setup: "4–8 weeks"
      maintenance: "Full-time (proxy management, anti-bot, source changes)"
      accuracy: "Varies"
      starting_cost: "$5,000+/month"
    - approach: "DIY scraping tools (Apify, ScrapingBee)"
      setup: "1–2 weeks"
      maintenance: "High (user responsible)"
      accuracy: "70–85%"
      starting_cost: "$500+/month + developer time"

