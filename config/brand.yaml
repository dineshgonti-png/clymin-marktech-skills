# ============================================================
# CORE DIFFERENTIATOR
# ============================================================
differentiator:
  name: "AI-Agentic Scraping"
  description: >
    Clymin uses intelligent AI agents that learn and adapt — not static scrapers.
    Our fully managed, end-to-end service handles setup, maintenance, and delivery
    so you get clean, structured, real-time data without any technical overhead.
  proof_points:
    - metric: "200+"
      label: "Clients Served"
      meaning: "Trusted by over 200 businesses across industries"
      display_in_metrics_bar: true
    - metric: "750+"
      label: "Projects Delivered"
      meaning: "Successfully completed over 750 data extraction projects"
      display_in_metrics_bar: true
    - metric: "12+"
      label: "Years Experience"
      meaning: "Over a decade of expertise in web scraping and data extraction"
      display_in_metrics_bar: true
    - metric: "100B+"
      label: "Data Points Extracted"
      meaning: "Over 100 billion data points extracted and delivered"
      display_in_metrics_bar: true

# ============================================================
# PROCESS
# ============================================================
process:
  - step: 1
    name: "Initial Consultation"
    detail: >
      We understand your data requirements, target sources, and business goals
      to design a custom extraction strategy.
  - step: 2
    name: "Custom Scraping Setup"
    detail: >
      Our AI agents are configured and deployed to extract data from your
      specified web and mobile app sources with precision.
  - step: 3
    name: "Data Delivery & Maintenance"
    detail: >
      Clean, structured datasets are delivered on your schedule. We handle
      ongoing maintenance, anti-blocking, and source changes automatically.

