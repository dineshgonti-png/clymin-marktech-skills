  <text x="110" y="445" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✗ $5K-50K+ per region</text>
  <text x="110" y="470" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✗ No valuations or tax data</text>
  <rect x="110" y="490" width="140" height="28" rx="4" fill="#4ECDC4" opacity="0.2"/>
  <text x="120" y="509" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4ECDC4">ACCURACY LEADER</text>
  <!-- Scraping card -->
  <rect x="620" y="280" width="420" height="260" rx="10" fill="#232345" stroke="#FF6B35" stroke-width="1.5" opacity="0.9"/>
  <text x="650" y="315" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FF6B35">Web Scraping</text>
  <text x="650" y="345" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#888">CHARACTERISTICS</text>
  <text x="650" y="370" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✓ National coverage instantly</text>
  <text x="650" y="395" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✓ Off-market + rentals</text>
  <text x="650" y="420" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✓ Valuations + tax data</text>
  <text x="650" y="445" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✓ No access restrictions</text>
  <text x="650" y="470" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ccc">✗ 12-48h listing delay</text>
