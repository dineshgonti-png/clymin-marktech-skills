<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <!-- Hotel building 1 -->
  <rect x="100" y="200" width="120" height="250" rx="4" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <rect x="115" y="220" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="150" y="220" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.4"/>
  <rect x="185" y="220" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="115" y="255" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.5"/>
  <rect x="150" y="255" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="185" y="255" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.4"/>
  <rect x="115" y="290" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="150" y="290" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.5"/>
  <rect x="185" y="290" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="115" y="325" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.4"/>
  <rect x="150" y="325" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="185" y="325" width="25" height="20" rx="2" fill="#FF6B35" opacity="0.5"/>
  <!-- Hotel roof -->
  <polygon points="95,200 160,150 225,200" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <!-- Hotel building 2 (taller) -->
  <rect x="260" y="160" width="100" height="290" rx="4" fill="#16213e" stroke="#FF6B35" stroke-width="1"/>
  <rect x="275" y="180" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.35"/>
  <rect x="305" y="180" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.25"/>
  <rect x="335" y="180" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.4"/>
  <rect x="275" y="210" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="305" y="210" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.45"/>
  <rect x="335" y="210" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="275" y="240" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.5"/>
  <rect x="305" y="240" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.3"/>
  <rect x="335" y="240" width="20" height="16" rx="2" fill="#FF6B35" opacity="0.35"/>
  <!-- Data streams flowing from hotels -->
  <line x1="230" y1="280" x2="450" y2="230" stroke="#FF6B35" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="230" y1="320" x2="450" y2="280" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="365" y1="220" x2="450" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.7" stroke-dasharray="4,3"/>
  <line x1="365" y1="300" x2="450" y2="310" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Price data particles -->
  <circle cx="340" cy="270" r="3" fill="#FF6B35" opacity="0.7"/>
  <circle cx="380" cy="245" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="400" cy="300" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="420" cy="260" r="3" fill="#FF6B35" opacity="0.8"/>
  <!-- Central processing node -->
  <rect x="450" y="200" width="300" height="200" rx="12" fill="#16213e" stroke="#FF6B35" stroke-width="2"/>
  <!-- Price tags inside -->
  <text x="490" y="245" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.8">$199</text>
  <text x="560" y="245" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.5">$245</text>
  <text x="630" y="245" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.6">$189</text>
  <text x="700" y="245" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.4">$312</text>
  <text x="490" y="280" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.4">$275</text>
  <text x="560" y="280" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.7">$156</text>
  <text x="630" y="280" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.5">$420</text>
  <text x="700" y="280" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.6">$198</text>
  <text x="490" y="315" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.5">$340</text>
  <text x="560" y="315" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.6">$167</text>
  <text x="630" y="315" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" opacity="0.8">$225</text>
  <text x="700" y="315" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.4">$289</text>
  <!-- Horizontal lines for table effect -->
  <line x1="470" y1="255" x2="730" y2="255" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="470" y1="290" x2="730" y2="290" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="470" y1="325" x2="730" y2="325" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <!-- Processing label -->
  <text x="600" y="375" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" opacity="0.7">Real-Time Rate Intelligence</text>
  <!-- Output arrows -->
  <line x1="750" y1="260" x2="850" y2="230" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <line x1="750" y1="300" x2="850" y2="300" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <line x1="750" y1="340" x2="850" y2="370" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <!-- Output endpoints -->
  <rect x="850" y="210" width="120" height="40" rx="8" fill="#FF6B35" opacity="0.2" stroke="#FF6B35" stroke-width="1"/>
  <text x="910" y="235" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">API Feed</text>
  <rect x="850" y="280" width="120" height="40" rx="8" fill="#FF6B35" opacity="0.2" stroke="#FF6B35" stroke-width="1"/>
  <text x="910" y="305" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">Dashboard</text>
  <rect x="850" y="350" width="120" height="40" rx="8" fill="#FF6B35" opacity="0.2" stroke="#FF6B35" stroke-width="1"/>
  <text x="910" y="375" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">RMS Integration</text>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Hotel Rate Scraping Service</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Real-time competitor pricing from every booking channel</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>
