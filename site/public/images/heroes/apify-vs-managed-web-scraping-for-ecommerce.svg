<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Diagonal lines background texture -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="0" x2="200" y2="630"/><line x1="100" y1="0" x2="300" y2="630"/>
    <line x1="200" y1="0" x2="400" y2="630"/><line x1="300" y1="0" x2="500" y2="630"/>
    <line x1="400" y1="0" x2="600" y2="630"/><line x1="500" y1="0" x2="700" y2="630"/>
    <line x1="600" y1="0" x2="800" y2="630"/><line x1="700" y1="0" x2="900" y2="630"/>
    <line x1="800" y1="0" x2="1000" y2="630"/><line x1="900" y1="0" x2="1100" y2="630"/>
    <line x1="1000" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="95" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIY vs Managed Scraping</text>
  <text x="600" y="135" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#F8F9FA" text-anchor="middle" opacity="0.5">E-commerce Web Scraping Approaches</text>

  <!-- LEFT SIDE: Code/Terminal shapes -->
  <!-- Terminal window -->
  <rect x="80" y="210" width="360" height="220" rx="8" fill="#0d0d1a" stroke="#FF6B35" stroke-width="1.2" opacity="0.9"/>
  <!-- Terminal title bar -->
  <rect x="80" y="210" width="360" height="28" rx="8" fill="#FF6B35" opacity="0.12"/>
  <circle cx="100" cy="224" r="5" fill="#FF6B35" opacity="0.6"/>
  <circle cx="116" cy="224" r="5" fill="#FFD166" opacity="0.5"/>
  <circle cx="132" cy="224" r="5" fill="#FFFFFF" opacity="0.2"/>

  <!-- Code lines -->
  <text x="100" y="260" font-family="monospace" font-size="11" fill="#FF6B35" opacity="0.8">const scraper = new Apify();</text>
  <text x="100" y="278" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.5">await scraper.init({</text>
  <text x="100" y="296" font-family="monospace" font-size="11" fill="#FFD166" opacity="0.6">  proxy: rotateIP(),</text>
  <text x="100" y="314" font-family="monospace" font-size="11" fill="#FFD166" opacity="0.6">  retries: 3,</text>
  <text x="100" y="332" font-family="monospace" font-size="11" fill="#FFD166" opacity="0.6">  captcha: solve(),</text>
  <text x="100" y="350" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.5">});</text>
  <text x="100" y="368" font-family="monospace" font-size="11" fill="#FF6B35" opacity="0.7">// handle errors...</text>
  <text x="100" y="386" font-family="monospace" font-size="11" fill="#FF6B35" opacity="0.7">// manage proxies...</text>
  <text x="100" y="404" font-family="monospace" font-size="11" fill="#FF6B35" opacity="0.5">// parse HTML...</text>

  <!-- Complexity indicators around terminal -->
  <g opacity="0.4">
    <!-- Error symbol -->
    <circle cx="100" cy="470" r="10" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="100" y="474" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">!</text>
    <text x="120" y="474" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FF6B35">Proxy rotation</text>

    <circle cx="250" cy="470" r="10" fill="none" stroke="#FFD166" stroke-width="1.5"/>
    <text x="250" y="474" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFD166" text-anchor="middle" font-weight="700">!</text>
    <text x="270" y="474" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFD166">CAPTCHA solving</text>
  </g>

  <text x="260" y="520" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" opacity="0.5">DO IT YOURSELF</text>

  <!-- CENTER: VS Divider -->
  <line x1="560" y1="175" x2="560" y2="270" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
  <line x1="560" y1="410" x2="560" y2="530" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

  <!-- Arrow pointing right -->
  <g transform="translate(560, 340)">
    <circle r="40" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <text y="10" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">VS</text>
  </g>

  <!-- RIGHT SIDE: Clean pipeline/workflow -->
  <!-- Pipeline stages -->
  <!-- Stage 1: Input -->
  <rect x="680" y="240" width="130" height="50" rx="25" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="745" y="270" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.8">URLs Input</text>

  <!-- Arrow -->
  <line x1="745" y1="295" x2="745" y2="310" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>
  <polygon points="739,310 745,320 751,310" fill="#FF6B35" opacity="0.5"/>

  <!-- Stage 2: Processing -->
  <rect x="680" y="325" width="130" height="50" rx="25" fill="#FFD166" opacity="0.12" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="745" y="355" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Processing</text>

  <!-- Arrow -->
  <line x1="745" y1="380" x2="745" y2="395" stroke="#FFD166" stroke-width="1.5" opacity="0.5"/>
  <polygon points="739,395 745,405 751,395" fill="#FFD166" opacity="0.5"/>

  <!-- Stage 3: Output -->
  <rect x="680" y="410" width="130" height="50" rx="25" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="745" y="440" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Clean Data</text>

  <!-- Side features connected to pipeline -->
  <!-- Auto proxy -->
  <line x1="815" y1="265" x2="870" y2="265" stroke="#FF6B35" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <rect x="875" y="250" width="100" height="30" rx="4" fill="#FF6B35" opacity="0.08" stroke="#FF6B35" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="925" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.6">Auto Proxies</text>

  <!-- Anti-block -->
  <line x1="815" y1="350" x2="870" y2="350" stroke="#FFD166" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <rect x="875" y="335" width="100" height="30" rx="4" fill="#FFD166" opacity="0.08" stroke="#FFD166" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="925" y="355" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFD166" text-anchor="middle" opacity="0.6">Anti-Blocking</text>

  <!-- Data QA -->
  <line x1="815" y1="435" x2="870" y2="435" stroke="#FF6B35" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <rect x="875" y="420" width="100" height="30" rx="4" fill="#FF6B35" opacity="0.08" stroke="#FF6B35" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="925" y="440" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.6">Data QA</text>

  <!-- Green checkmarks -->
  <circle cx="990" cy="265" r="8" fill="#4CAF50" opacity="0.5"/>
  <text x="990" y="269" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">&#10003;</text>
  <circle cx="990" cy="350" r="8" fill="#4CAF50" opacity="0.5"/>
  <text x="990" y="354" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">&#10003;</text>
  <circle cx="990" cy="435" r="8" fill="#4CAF50" opacity="0.5"/>
  <text x="990" y="439" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">&#10003;</text>

  <text x="850" y="520" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFD166" text-anchor="middle" opacity="0.5">FULLY MANAGED</text>

  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="20" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.15"/>
  <circle cx="60" cy="60" r="35" fill="none" stroke="#FF6B35" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1140" cy="570" r="20" fill="none" stroke="#FFD166" stroke-width="1" opacity="0.15"/>
  <circle cx="1140" cy="570" r="35" fill="none" stroke="#FFD166" stroke-width="0.5" opacity="0.08"/>

  <!-- Clymin brand -->
  <text x="1150" y="608" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>