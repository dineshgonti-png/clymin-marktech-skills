<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="tierGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>

  <!-- Dot pattern background -->
  <g fill="#FFFFFF" opacity="0.03">
    <circle cx="30" cy="30" r="1.5"/><circle cx="90" cy="30" r="1.5"/><circle cx="150" cy="30" r="1.5"/>
    <circle cx="210" cy="30" r="1.5"/><circle cx="270" cy="30" r="1.5"/><circle cx="330" cy="30" r="1.5"/>
    <circle cx="30" cy="90" r="1.5"/><circle cx="90" cy="90" r="1.5"/><circle cx="150" cy="90" r="1.5"/>
    <circle cx="210" cy="90" r="1.5"/><circle cx="270" cy="90" r="1.5"/><circle cx="330" cy="90" r="1.5"/>
    <circle cx="30" cy="150" r="1.5"/><circle cx="90" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/>
    <circle cx="210" cy="150" r="1.5"/><circle cx="270" cy="150" r="1.5"/><circle cx="330" cy="150" r="1.5"/>
  </g>

  <!-- Decorative corner accent bottom-right -->
  <polygon points="1200,630 1020,630 1200,450" fill="#FFD166" opacity="0.05"/>

  <!-- Pricing tier bars -->
  <!-- Basic tier -->
  <g transform="translate(700, 140)">
    <rect x="0" y="200" width="80" height="160" rx="6" fill="#FF6B35" opacity="0.2"/>
    <rect x="0" y="200" width="80" height="160" rx="6" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
    <rect x="10" y="210" width="60" height="140" rx="4" fill="#FF6B35" opacity="0.1"/>
    <text x="40" y="290" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" opacity="0.8">Basic</text>
    <text x="40" y="315" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">$49</text>
    <text x="40" y="332" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" opacity="0.4">/month</text>
  </g>

  <!-- Pro tier -->
  <g transform="translate(820, 140)">
    <rect x="0" y="120" width="80" height="240" rx="6" fill="#FF6B35" opacity="0.3"/>
    <rect x="0" y="120" width="80" height="240" rx="6" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
    <rect x="10" y="130" width="60" height="220" rx="4" fill="#FF6B35" opacity="0.1"/>
    <!-- Popular badge -->
    <rect x="10" y="110" width="60" height="20" rx="10" fill="#FF6B35"/>
    <text x="40" y="124" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">POPULAR</text>
    <text x="40" y="230" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" opacity="0.9">Pro</text>
    <text x="40" y="255" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">$199</text>
    <text x="40" y="272" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" opacity="0.4">/month</text>
  </g>

  <!-- Enterprise tier -->
  <g transform="translate(940, 140)">
    <rect x="0" y="50" width="80" height="310" rx="6" fill="#FFD166" opacity="0.15"/>
    <rect x="0" y="50" width="80" height="310" rx="6" fill="none" stroke="#FFD166" stroke-width="2" opacity="0.5"/>
    <rect x="10" y="60" width="60" height="290" rx="4" fill="#FFD166" opacity="0.05"/>
    <text x="40" y="200" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" opacity="0.9">Enterprise</text>
    <text x="40" y="225" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Custom</text>
  </g>

  <!-- Scale/balance visual -->
  <g transform="translate(1080, 300)" opacity="0.2">
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#FFD166" stroke-width="2"/>
    <line x1="-40" y1="-80" x2="40" y2="-80" stroke="#FFD166" stroke-width="2"/>
    <circle cx="0" cy="-80" r="5" fill="#FFD166" opacity="0.5"/>
    <line x1="-40" y1="-80" x2="-40" y2="-50" stroke="#FFD166" stroke-width="1.5"/>
    <line x1="40" y1="-80" x2="40" y2="-65" stroke="#FFD166" stroke-width="1.5"/>
    <rect x="-55" y="-50" width="30" height="20" rx="3" fill="none" stroke="#FFD166" stroke-width="1"/>
    <rect x="25" y="-65" width="30" height="20" rx="3" fill="none" stroke="#FFD166" stroke-width="1"/>
  </g>

  <!-- Calculator elements -->
  <g transform="translate(1060, 430)" opacity="0.12">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <rect x="10" y="10" width="60" height="20" rx="3" fill="#FF6B35" opacity="0.3"/>
    <rect x="10" y="40" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="32" y="40" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="54" y="40" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="10" y="58" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="32" y="58" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="54" y="58" width="16" height="12" rx="2" fill="#FFD166" opacity="0.3"/>
    <rect x="10" y="76" width="38" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="54" y="76" width="16" height="12" rx="2" fill="#FF6B35" opacity="0.2"/>
  </g>

  <!-- Dollar sign decorations -->
  <text x="660" y="480" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="140" font-weight="800" opacity="0.04">$</text>
  <text x="180" y="580" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="800" opacity="0.03">$</text>

  <!-- Cost trend line -->
  <g transform="translate(700, 480)">
    <polyline points="0,40 40,35 80,20 120,25 160,10 200,15 240,5 280,0" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="40" r="3" fill="#FF6B35" opacity="0.4"/>
    <circle cx="80" cy="20" r="3" fill="#FF6B35" opacity="0.4"/>
    <circle cx="160" cy="10" r="3" fill="#FF6B35" opacity="0.4"/>
    <circle cx="280" cy="0" r="3" fill="#FFD166" opacity="0.5"/>
  </g>

  <!-- Floating accent dots -->
  <circle cx="670" cy="100" r="4" fill="#FF6B35" opacity="0.2"/>
  <circle cx="1150" cy="160" r="3" fill="#FFD166" opacity="0.25"/>
  <circle cx="640" cy="400" r="2" fill="#FFD166" opacity="0.2"/>

  <!-- Decorative line left -->
  <rect x="80" y="430" width="160" height="3" rx="1.5" fill="#FFD166" opacity="0.2"/>
  <rect x="80" y="430" width="60" height="3" rx="1.5" fill="#FFD166" opacity="0.5"/>

  <!-- Title Text -->
  <text x="80" y="180" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Data Scraping</text>
  <text x="80" y="250" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Costs</text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" opacity="0.5">Compare plans, pricing tiers &amp; ROI</text>

  <!-- Pricing badge -->
  <rect x="80" y="110" width="82" height="26" rx="13" fill="#FFD166" opacity="0.15"/>
  <text x="121" y="128" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PRICING</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end" opacity="0.8">Clymin</text>
</svg>