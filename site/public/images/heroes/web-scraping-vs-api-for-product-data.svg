<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="orangeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="63" x2="1200" y2="63"/><line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
  </g>

  <!-- LEFT SIDE: Web/Spider shapes -->
  <!-- Central spider web node -->
  <circle cx="280" cy="340" r="30" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.9"/>
  <circle cx="280" cy="340" r="8" fill="#FF6B35" opacity="0.9"/>
  <circle cx="280" cy="340" r="60" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
  <circle cx="280" cy="340" r="95" fill="none" stroke="#FF6B35" stroke-width="0.8" opacity="0.2"/>

  <!-- Web connection lines radiating out -->
  <line x1="280" y1="340" x2="160" y2="260" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="340" x2="380" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="340" x2="170" y2="420" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="340" x2="400" y2="430" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="340" x2="140" y2="340" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="340" x2="280" y2="210" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>
  <line x1="280" y1="340" x2="280" y2="470" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>

  <!-- Outer nodes (web pages) -->
  <rect x="130" y="240" width="60" height="40" rx="4" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="252" x2="180" y2="252" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="260" x2="170" y2="260" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="268" x2="175" y2="268" stroke="#FFD166" stroke-width="1" opacity="0.5"/>

  <rect x="350" y="230" width="60" height="40" rx="4" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.7"/>
  <line x1="360" y1="242" x2="400" y2="242" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="250" x2="390" y2="250" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="258" x2="395" y2="258" stroke="#FFD166" stroke-width="1" opacity="0.5"/>

  <rect x="130" y="400" width="60" height="40" rx="4" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="412" x2="180" y2="412" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="420" x2="170" y2="420" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="428" x2="175" y2="428" stroke="#FFD166" stroke-width="1" opacity="0.5"/>

  <rect x="370" y="410" width="60" height="40" rx="4" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.7"/>
  <line x1="380" y1="422" x2="420" y2="422" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="430" x2="410" y2="430" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="438" x2="415" y2="438" stroke="#FFD166" stroke-width="1" opacity="0.5"/>

  <!-- Small label -->
  <text x="280" y="510" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.7">WEB SCRAPING</text>

  <!-- CENTER: VS Divider -->
  <line x1="600" y1="180" x2="600" y2="280" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
  <line x1="600" y1="400" x2="600" y2="520" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- VS circle -->
  <circle cx="600" cy="340" r="45" fill="#1a1a2e" stroke="url(#orangeGrad1)" stroke-width="2.5"/>
  <text x="600" y="352" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">VS</text>

  <!-- Data flow dots left to center -->
  <circle cx="470" cy="310" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="490" cy="325" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="510" cy="335" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="530" cy="340" r="2" fill="#FFD166" opacity="0.5"/>
  <circle cx="545" cy="340" r="1.5" fill="#FFD166" opacity="0.4"/>

  <!-- Data flow dots right from center -->
  <circle cx="655" cy="340" r="1.5" fill="#FFD166" opacity="0.4"/>
  <circle cx="670" cy="340" r="2" fill="#FFD166" opacity="0.5"/>
  <circle cx="690" cy="335" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="710" cy="325" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="730" cy="310" r="3" fill="#FF6B35" opacity="0.6"/>

  <!-- RIGHT SIDE: API endpoint shapes -->
  <!-- API bracket shapes -->
  <text x="920" y="310" font-family="monospace" font-size="80" fill="#FF6B35" text-anchor="middle" opacity="0.15">{  }</text>

  <!-- API endpoint boxes -->
  <g transform="translate(820, 270)">
    <rect width="200" height="32" rx="4" fill="#FF6B35" opacity="0.15"/>
    <text x="10" y="21" font-family="monospace" font-size="12" fill="#FF6B35" opacity="0.8">GET /api/products</text>
    <circle cx="188" cy="16" r="5" fill="#4CAF50" opacity="0.7"/>
  </g>
  <g transform="translate(820, 312)">
    <rect width="200" height="32" rx="4" fill="#FF6B35" opacity="0.1"/>
    <text x="10" y="21" font-family="monospace" font-size="12" fill="#FFD166" opacity="0.7">GET /api/prices</text>
    <circle cx="188" cy="16" r="5" fill="#4CAF50" opacity="0.7"/>
  </g>
  <g transform="translate(820, 354)">
    <rect width="200" height="32" rx="4" fill="#FF6B35" opacity="0.15"/>
    <text x="10" y="21" font-family="monospace" font-size="12" fill="#FF6B35" opacity="0.8">POST /api/data</text>
    <circle cx="188" cy="16" r="5" fill="#FFD166" opacity="0.7"/>
  </g>

  <!-- Response arrow -->
  <line x1="920" y1="400" x2="920" y2="440" stroke="#FFD166" stroke-width="1.5" opacity="0.5"/>
  <polygon points="912,440 920,452 928,440" fill="#FFD166" opacity="0.5"/>

  <!-- JSON response block -->
  <rect x="850" y="458" width="140" height="50" rx="6" fill="#FFD166" opacity="0.08" stroke="#FFD166" stroke-width="1" stroke-opacity="0.3"/>
  <text x="862" y="476" font-family="monospace" font-size="10" fill="#FFD166" opacity="0.6">{ "status": 200,</text>
  <text x="862" y="490" font-family="monospace" font-size="10" fill="#FFD166" opacity="0.6">  "data": [...] }</text>

  <!-- Small label -->
  <text x="920" y="540" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFD166" text-anchor="middle" opacity="0.7">API ACCESS</text>

  <!-- Decorative corner accents -->
  <line x1="40" y1="40" x2="100" y2="40" stroke="#FF6B35" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="40" x2="40" y2="100" stroke="#FF6B35" stroke-width="2" opacity="0.4"/>
  <line x1="1160" y1="40" x2="1100" y2="40" stroke="#FF6B35" stroke-width="2" opacity="0.4"/>
  <line x1="1160" y1="40" x2="1160" y2="100" stroke="#FF6B35" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="590" x2="100" y2="590" stroke="#FFD166" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="590" x2="40" y2="530" stroke="#FFD166" stroke-width="2" opacity="0.3"/>
  <line x1="1160" y1="590" x2="1100" y2="590" stroke="#FFD166" stroke-width="2" opacity="0.3"/>
  <line x1="1160" y1="590" x2="1160" y2="530" stroke="#FFD166" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="600" y="110" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web Scraping vs API</text>
  <text x="600" y="150" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#F8F9FA" text-anchor="middle" opacity="0.6">for Product Data Collection</text>

  <!-- Clymin brand -->
  <text x="1150" y="608" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>