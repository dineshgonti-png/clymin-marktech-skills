<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Rate Scraping Costs</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Transparent pricing tiers for hotel rate intelligence</text>
  <!-- Pricing tier columns -->
  <!-- Basic tier -->
  <rect x="160" y="260" width="240" height="280" rx="12" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <rect x="160" y="260" width="240" height="55" rx="12" fill="#FF6B35" opacity="0.1"/>
  <text x="280" y="292" font-family="Inter, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">Basic</text>
  <!-- Dollar sign decorations -->
  <text x="250" y="360" font-family="Inter, sans-serif" font-size="42" fill="#FF6B35" text-anchor="middle" font-weight="700" opacity="0.9">$500</text>
  <text x="280" y="385" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.4">/month</text>
  <!-- Features -->
  <text x="195" y="420" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; 50 properties</text>
  <text x="195" y="440" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Daily updates</text>
  <text x="195" y="460" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; 3 OTA sources</text>
  <text x="195" y="480" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; CSV export</text>
  <text x="195" y="500" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Email support</text>
  <!-- Pro tier (taller, highlighted) -->
  <rect x="480" y="200" width="240" height="340" rx="12" fill="#16213e" stroke="#FF6B35" stroke-width="2.5"/>
  <rect x="480" y="200" width="240" height="55" rx="12" fill="#FF6B35" opacity="0.2"/>
  <text x="600" y="232" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" text-anchor="middle" font-weight="700">Pro</text>
  <!-- Popular badge -->
  <rect x="555" y="185" width="90" height="22" rx="11" fill="#FF6B35" opacity="0.3" stroke="#FF6B35" stroke-width="1"/>
  <text x="600" y="200" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" font-weight="700">POPULAR</text>
  <text x="565" y="310" font-family="Inter, sans-serif" font-size="42" fill="#FF6B35" text-anchor="middle" font-weight="700">$1,500</text>
  <text x="600" y="335" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.4">/month</text>
  <text x="515" y="370" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; 500 properties</text>
  <text x="515" y="390" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Hourly updates</text>
  <text x="515" y="410" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; 10+ OTA sources</text>
  <text x="515" y="430" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; API access</text>
  <text x="515" y="450" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Dashboard</text>
  <text x="515" y="470" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Rate alerts</text>
  <text x="515" y="490" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Priority support</text>
  <!-- Enterprise tier -->
  <rect x="800" y="230" width="240" height="310" rx="12" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <rect x="800" y="230" width="240" height="55" rx="12" fill="#FF6B35" opacity="0.1"/>
  <text x="920" y="262" font-family="Inter, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">Enterprise</text>
  <text x="920" y="340" font-family="Inter, sans-serif" font-size="32" fill="#FF6B35" text-anchor="middle" font-weight="700">Custom</text>
  <text x="920" y="365" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.4">tailored pricing</text>
  <text x="835" y="400" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Unlimited properties</text>
  <text x="835" y="420" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Real-time updates</text>
  <text x="835" y="440" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; All OTA sources</text>
  <text x="835" y="460" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Custom integrations</text>
  <text x="835" y="480" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; Dedicated account</text>
  <text x="835" y="500" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">&#10003; SLA guarantee</text>
  <!-- Dollar sign decorations floating -->
  <text x="120" y="200" font-family="Inter, sans-serif" font-size="20" fill="#FF6B35" opacity="0.15">$</text>
  <text x="1080" y="190" font-family="Inter, sans-serif" font-size="24" fill="#FF6B35" opacity="0.12">$</text>
  <text x="100" y="450" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" opacity="0.1">$</text>
  <text x="1100" y="430" font-family="Inter, sans-serif" font-size="22" fill="#FF6B35" opacity="0.1">$</text>
  <text x="450" y="180" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" opacity="0.1">$</text>
  <text x="760" y="200" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" opacity="0.1">$</text>
  <!-- Cost/value balance beam at bottom -->
  <line x1="350" y1="575" x2="850" y2="575" stroke="#FF6B35" stroke-width="1.5" opacity="0.3"/>
  <polygon points="600,565 590,575 610,575" fill="#FF6B35" opacity="0.3"/>
  <text x="420" y="570" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Cost</text>
  <text x="780" y="570" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Value</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>