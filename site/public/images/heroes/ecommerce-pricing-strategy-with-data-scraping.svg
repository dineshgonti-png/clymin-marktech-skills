<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad5)"/>

  <!-- Chessboard pattern (strategy theme) -->
  <g opacity="0.04">
    <rect x="650" y="80" width="50" height="50" fill="#FFFFFF"/>
    <rect x="750" y="80" width="50" height="50" fill="#FFFFFF"/>
    <rect x="700" y="130" width="50" height="50" fill="#FFFFFF"/>
    <rect x="800" y="130" width="50" height="50" fill="#FFFFFF"/>
    <rect x="650" y="180" width="50" height="50" fill="#FFFFFF"/>
    <rect x="750" y="180" width="50" height="50" fill="#FFFFFF"/>
    <rect x="700" y="230" width="50" height="50" fill="#FFFFFF"/>
    <rect x="800" y="230" width="50" height="50" fill="#FFFFFF"/>
    <rect x="850" y="80" width="50" height="50" fill="#FFFFFF"/>
    <rect x="950" y="80" width="50" height="50" fill="#FFFFFF"/>
    <rect x="900" y="130" width="50" height="50" fill="#FFFFFF"/>
    <rect x="1000" y="130" width="50" height="50" fill="#FFFFFF"/>
    <rect x="850" y="180" width="50" height="50" fill="#FFFFFF"/>
    <rect x="950" y="180" width="50" height="50" fill="#FFFFFF"/>
    <rect x="900" y="230" width="50" height="50" fill="#FFFFFF"/>
    <rect x="1000" y="230" width="50" height="50" fill="#FFFFFF"/>
  </g>

  <!-- Chess piece - King (geometric/abstract) -->
  <g transform="translate(750, 160)" opacity="0.35">
    <rect x="-12" y="30" width="24" height="6" rx="2" fill="#FF6B35"/>
    <rect x="-8" y="10" width="16" height="22" rx="3" fill="#FF6B35"/>
    <rect x="-3" y="-5" width="6" height="18" rx="2" fill="#FF6B35"/>
    <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#FF6B35"/>
  </g>

  <!-- Chess piece - Rook (geometric) -->
  <g transform="translate(870, 190)" opacity="0.25">
    <rect x="-12" y="25" width="24" height="6" rx="2" fill="#FFD166"/>
    <rect x="-8" y="5" width="16" height="22" rx="2" fill="#FFD166"/>
    <rect x="-10" y="-2" width="4" height="10" rx="1" fill="#FFD166"/>
    <rect x="-2" y="-2" width="4" height="10" rx="1" fill="#FFD166"/>
    <rect x="6" y="-2" width="4" height="10" rx="1" fill="#FFD166"/>
  </g>

  <!-- Chess piece - Bishop (geometric) -->
  <g transform="translate(990, 150)" opacity="0.2">
    <rect x="-10" y="28" width="20" height="5" rx="2" fill="#FF6B35"/>
    <rect x="-6" y="8" width="12" height="22" rx="4" fill="#FF6B35"/>
    <circle cx="0" cy="2" r="5" fill="#FF6B35"/>
    <rect x="-1.5" y="-6" width="3" height="6" rx="1" fill="#FF6B35"/>
  </g>

  <!-- Price chart overlay -->
  <g transform="translate(680, 300)">
    <!-- Chart axes -->
    <line x1="0" y1="180" x2="440" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

    <!-- Y-axis labels -->
    <text x="-8" y="185" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="end" opacity="0.2">$0</text>
    <text x="-8" y="95" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="end" opacity="0.2">$50</text>
    <text x="-8" y="5" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="end" opacity="0.2">$100</text>

    <!-- Grid lines -->
    <line x1="0" y1="90" x2="440" y2="90" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05" stroke-dasharray="4,4"/>
    <line x1="0" y1="45" x2="440" y2="45" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05" stroke-dasharray="4,4"/>
    <line x1="0" y1="135" x2="440" y2="135" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05" stroke-dasharray="4,4"/>

    <!-- Competitor price line (dashed) -->
    <polyline points="0,120 50,115 100,100 150,110 200,95 250,105 300,80 350,90 400,70 440,75"
      fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.2"/>

    <!-- Your optimized price line (solid orange) -->
    <polyline points="0,140 50,130 100,110 150,100 200,90 250,80 300,70 350,55 400,45 440,40"
      fill="none" stroke="#FF6B35" stroke-width="2.5" opacity="0.7"/>

    <!-- Area fill under orange line -->
    <polygon points="0,140 50,130 100,110 150,100 200,90 250,80 300,70 350,55 400,45 440,40 440,180 0,180"
      fill="url(#chartGrad)" opacity="0.3"/>

    <!-- Data points on orange line -->
    <circle cx="100" cy="110" r="3" fill="#FF6B35" opacity="0.8"/>
    <circle cx="200" cy="90" r="3" fill="#FF6B35" opacity="0.8"/>
    <circle cx="300" cy="70" r="4" fill="#FF6B35"/>
    <circle cx="440" cy="40" r="4" fill="#FFD166"/>

    <!-- Profit zone annotation -->
    <rect x="310" y="18" width="80" height="20" rx="10" fill="#FF6B35" opacity="0.2"/>
    <text x="350" y="32" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">+42% ROI</text>

    <!-- Legend -->
    <line x1="300" y1="170" x2="320" y2="170" stroke="#FF6B35" stroke-width="2"/>
    <text x="325" y="174" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="8" opacity="0.4">Optimized</text>
    <line x1="385" y1="170" x2="405" y2="170" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>
    <text x="410" y="174" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="8" opacity="0.3">Competitor</text>
  </g>

  <!-- Strategy planning board overlay elements -->
  <g opacity="0.1">
    <!-- Target/crosshair -->
    <circle cx="1050" cy="350" r="30" fill="none" stroke="#FFD166" stroke-width="1.5"/>
    <circle cx="1050" cy="350" r="18" fill="none" stroke="#FFD166" stroke-width="1"/>
    <circle cx="1050" cy="350" r="6" fill="#FFD166" opacity="0.5"/>
    <line x1="1050" y1="315" x2="1050" y2="385" stroke="#FFD166" stroke-width="0.8"/>
    <line x1="1015" y1="350" x2="1085" y2="350" stroke="#FFD166" stroke-width="0.8"/>
  </g>

  <!-- Strategic data nodes -->
  <g opacity="0.15">
    <circle cx="1100" cy="450" r="18" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="1100" y="454" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">AI</text>
    <circle cx="1050" cy="510" r="15" fill="none" stroke="#FFD166" stroke-width="1"/>
    <text x="1050" y="514" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">ML</text>
    <line x1="1088" y1="462" x2="1060" y2="498" stroke="#FF6B35" stroke-width="0.8"/>
  </g>

  <!-- Decorative corners -->
  <polygon points="0,0 140,0 0,140" fill="#FFD166" opacity="0.04"/>
  <polygon points="1200,630 1200,550 1120,630" fill="#FF6B35" opacity="0.06"/>

  <!-- Floating accents -->
  <circle cx="640" cy="100" r="3" fill="#FF6B35" opacity="0.25"/>
  <circle cx="1150" cy="100" r="2.5" fill="#FFD166" opacity="0.2"/>
  <circle cx="660" cy="560" r="2" fill="#FFD166" opacity="0.15"/>

  <!-- Bottom accent bar -->
  <rect x="80" y="560" width="200" height="3" rx="1.5" fill="#FFD166" opacity="0.2"/>
  <rect x="80" y="560" width="80" height="3" rx="1.5" fill="#FFD166" opacity="0.5"/>

  <!-- Title Text -->
  <text x="80" y="195" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Pricing Strategy</text>
  <text x="80" y="265" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Guide</text>

  <!-- Subtitle -->
  <text x="80" y="315" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" opacity="0.5">Data-driven e-commerce pricing optimization</text>

  <!-- Strategy badge -->
  <rect x="80" y="123" width="95" height="26" rx="13" fill="#FFD166" opacity="0.15"/>
  <text x="127" y="141" fill="#FFD166" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">STRATEGY</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end" opacity="0.8">Clymin</text>
</svg>