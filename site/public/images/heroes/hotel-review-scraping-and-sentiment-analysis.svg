<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Review Sentiment Analysis</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Extract insights from hotel reviews at scale</text>
  <!-- Speech bubbles with sentiment (left side) -->
  <!-- Positive bubble -->
  <rect x="80" y="160" width="200" height="55" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <polygon points="140,215 150,230 160,215" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="110" y="182" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">"Amazing location and...</text>
  <text x="240" y="200" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" font-weight="700">+</text>
  <!-- Star ratings next to bubble -->
  <text x="95" y="200" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <!-- Negative bubble -->
  <rect x="100" y="260" width="200" height="55" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <polygon points="160,315 170,330 180,315" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="130" y="282" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">"Room was dirty and...</text>
  <text x="260" y="300" font-family="Inter, sans-serif" font-size="14" fill="#f87171" font-weight="700">-</text>
  <text x="115" y="300" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35">&#9733;&#9733;&#9734;&#9734;&#9734;</text>
  <!-- Neutral bubble -->
  <rect x="80" y="360" width="200" height="55" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <polygon points="130,415 140,430 150,415" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="110" y="382" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">"Decent stay, nothing...</text>
  <text x="240" y="400" font-family="Inter, sans-serif" font-size="14" fill="#facc15" font-weight="700">~</text>
  <text x="95" y="400" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35">&#9733;&#9733;&#9733;&#9734;&#9734;</text>
  <!-- More bubbles stacked -->
  <rect x="110" y="450" width="160" height="40" rx="8" fill="#16213e" stroke="#FF6B35" stroke-width="1" opacity="0.5"/>
  <text x="140" y="475" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">"Great breakfast..."</text>
  <text x="240" y="475" font-family="Inter, sans-serif" font-size="12" fill="#4ade80" font-weight="700">+</text>
  <!-- Flow arrows to analysis pipeline -->
  <line x1="300" y1="190" x2="420" y2="280" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="310" y1="290" x2="420" y2="300" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="390" x2="420" y2="320" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Analysis pipeline box -->
  <rect x="420" y="230" width="220" height="140" rx="12" fill="#16213e" stroke="#FF6B35" stroke-width="2"/>
  <text x="530" y="260" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">NLP Pipeline</text>
  <line x1="440" y1="272" x2="620" y2="272" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <text x="460" y="295" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Tokenization</text>
  <text x="460" y="315" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Sentiment Scoring</text>
  <text x="460" y="335" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Topic Extraction</text>
  <text x="460" y="355" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Aspect Analysis</text>
  <!-- Output arrow -->
  <line x1="640" y1="300" x2="720" y2="300" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <polygon points="720,295 730,300 720,305" fill="#FF6B35" opacity="0.6"/>
  <!-- Gauge meter (right side) -->
  <circle cx="850" cy="250" r="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <path d="M 780,280 A 80,80 0 1,1 920,280" fill="none" stroke="#FF6B35" stroke-width="4" opacity="0.3"/>
  <path d="M 780,280 A 80,80 0 1,1 905,220" fill="none" stroke="#FF6B35" stroke-width="4" opacity="0.8"/>
  <!-- Gauge needle -->
  <line x1="850" y1="250" x2="895" y2="210" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <circle cx="850" cy="250" r="5" fill="#FF6B35"/>
  <text x="850" y="310" font-family="Inter, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">8.4</text>
  <text x="850" y="330" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.7">Overall Sentiment</text>
  <!-- Sentiment breakdown bars -->
  <rect x="740" y="370" width="220" height="24" rx="4" fill="#16213e" stroke="#FF6B35" stroke-width="1"/>
  <rect x="742" y="372" width="154" height="20" rx="3" fill="#4ade80" opacity="0.3"/>
  <text x="750" y="387" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Positive 70%</text>
  <rect x="740" y="400" width="220" height="24" rx="4" fill="#16213e" stroke="#FF6B35" stroke-width="1"/>
  <rect x="742" y="402" width="44" height="20" rx="3" fill="#facc15" opacity="0.3"/>
  <text x="750" y="417" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Neutral 20%</text>
  <rect x="740" y="430" width="220" height="24" rx="4" fill="#16213e" stroke="#FF6B35" stroke-width="1"/>
  <rect x="742" y="432" width="22" height="20" rx="3" fill="#f87171" opacity="0.3"/>
  <text x="750" y="447" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">Negative 10%</text>
  <!-- Data particles -->
  <circle cx="370" cy="250" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="390" cy="320" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="680" cy="270" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="700" cy="320" r="2" fill="#FF6B35" opacity="0.4"/>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>