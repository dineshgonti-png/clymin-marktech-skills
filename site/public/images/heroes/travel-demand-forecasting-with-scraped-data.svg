<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Demand Forecasting</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Predictive intelligence powered by scraped travel data</text>
  <!-- Timeline axis -->
  <line x1="120" y1="420" x2="1080" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <!-- Timeline tick marks -->
  <line x1="200" y1="415" x2="200" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="200" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Jan</text>
  <line x1="320" y1="415" x2="320" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="320" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Mar</text>
  <line x1="440" y1="415" x2="440" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="440" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">May</text>
  <line x1="560" y1="415" x2="560" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="560" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Jul</text>
  <line x1="680" y1="415" x2="680" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="680" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Sep</text>
  <line x1="800" y1="415" x2="800" y2="425" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="800" y="445" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.4">Nov</text>
  <!-- Historical data line (solid) -->
  <polyline points="200,350 280,330 320,290 380,310 440,260 500,240 560,280 620,250" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
  <!-- Historical data dots -->
  <circle cx="200" cy="350" r="4" fill="#FF6B35"/>
  <circle cx="280" cy="330" r="4" fill="#FF6B35"/>
  <circle cx="320" cy="290" r="4" fill="#FF6B35"/>
  <circle cx="380" cy="310" r="4" fill="#FF6B35"/>
  <circle cx="440" cy="260" r="4" fill="#FF6B35"/>
  <circle cx="500" cy="240" r="4" fill="#FF6B35"/>
  <circle cx="560" cy="280" r="4" fill="#FF6B35"/>
  <circle cx="620" cy="250" r="4" fill="#FF6B35"/>
  <!-- Transition point - "Now" marker -->
  <line x1="620" y1="150" x2="620" y2="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <text x="620" y="470" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" font-weight="700">NOW</text>
  <!-- Forecast cone - upper bound -->
  <polyline points="620,250 700,220 780,190 860,170 940,155 1020,140" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Forecast cone - predicted line -->
  <polyline points="620,250 700,235 780,225 860,220 940,215 1020,210" fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
  <!-- Forecast cone - lower bound -->
  <polyline points="620,250 700,260 780,270 860,285 940,295 1020,300" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Forecast cone fill -->
  <polygon points="620,250 700,220 780,190 860,170 940,155 1020,140 1020,300 940,295 860,285 780,270 700,260 620,250" fill="#FF6B35" opacity="0.08"/>
  <!-- Data input nodes (left side) -->
  <rect x="80" y="150" width="110" height="36" rx="6" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="135" y="173" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">OTA Rates</text>
  <rect x="80" y="200" width="110" height="36" rx="6" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="135" y="223" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">Search Volume</text>
  <rect x="80" y="250" width="110" height="36" rx="6" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="135" y="273" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">Event Data</text>
  <rect x="80" y="300" width="110" height="36" rx="6" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <text x="135" y="323" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7">Flight Bookings</text>
  <!-- Arrows from data nodes to chart -->
  <line x1="190" y1="168" x2="280" y2="250" stroke="#FF6B35" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="190" y1="218" x2="280" y2="260" stroke="#FF6B35" stroke-width="1" opacity="0.35" stroke-dasharray="4,3"/>
  <line x1="190" y1="268" x2="280" y2="280" stroke="#FF6B35" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <line x1="190" y1="318" x2="280" y2="310" stroke="#FF6B35" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- Prediction model box -->
  <rect x="400" y="130" width="180" height="60" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="490" y="155" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">Prediction Model</text>
  <text x="490" y="175" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.5">ML Forecast Engine</text>
  <!-- Arrow from model to forecast -->
  <line x1="580" y1="160" x2="620" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Floating data particles -->
  <circle cx="250" cy="200" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="300" cy="180" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="350" cy="220" r="2.5" fill="#FF6B35" opacity="0.45"/>
  <circle cx="370" cy="170" r="2" fill="#ffffff" opacity="0.3"/>
  <!-- Labels on chart -->
  <text x="300" y="375" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.4">Historical Data</text>
  <text x="850" y="330" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">Forecast Range</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>