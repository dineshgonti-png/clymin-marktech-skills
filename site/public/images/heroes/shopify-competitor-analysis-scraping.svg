<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="streamGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Dot grid pattern -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Background glow -->
  <circle cx="780" cy="320" r="250" fill="#FF6B35" opacity="0.04"/>

  <!-- Shopping bag silhouette (Shopify-style) -->
  <g transform="translate(680, 160)">
    <!-- Bag body -->
    <path d="M40,100 L40,50 Q40,20 70,10 L130,10 Q160,20 160,50 L160,100 Q160,260 160,280 L40,280 Q40,260 40,100 Z" fill="url(#bagGrad)" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
    <!-- Bag handle -->
    <path d="M75,10 Q75,-30 100,-30 Q125,-30 125,10" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0.5"/>
    <!-- S shape inside bag -->
    <text x="100" y="180" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="900" fill="#FF6B35" opacity="0.15" text-anchor="middle">S</text>
  </g>

  <!-- Data streams flowing from bag -->
  <g>
    <!-- Stream 1 - top right -->
    <line x1="840" y1="220" x2="1000" y2="180" stroke="#FF6B35" stroke-width="2" opacity="0.3"/>
    <circle cx="1000" cy="180" r="4" fill="#FF6B35" opacity="0.5"/>
    <line x1="1000" y1="180" x2="1080" y2="160" stroke="#FF6B35" stroke-width="1" opacity="0.2"/>

    <!-- Stream 2 - right -->
    <line x1="840" y1="280" x2="980" y2="270" stroke="#FFD166" stroke-width="2" opacity="0.3"/>
    <circle cx="980" cy="270" r="3" fill="#FFD166" opacity="0.5"/>
    <line x1="980" y1="270" x2="1060" y2="260" stroke="#FFD166" stroke-width="1" opacity="0.2"/>

    <!-- Stream 3 - bottom right -->
    <line x1="840" y1="340" x2="1020" y2="370" stroke="#FF6B35" stroke-width="2" opacity="0.25"/>
    <circle cx="1020" cy="370" r="5" fill="#FF6B35" opacity="0.4"/>
    <line x1="1020" y1="370" x2="1100" y2="390" stroke="#FF6B35" stroke-width="1" opacity="0.15"/>

    <!-- Stream 4 - far right -->
    <line x1="840" y1="400" x2="960" y2="440" stroke="#FFD166" stroke-width="1.5" opacity="0.25"/>
    <circle cx="960" cy="440" r="3" fill="#FFD166" opacity="0.4"/>

    <!-- Stream 5 -->
    <line x1="840" y1="310" x2="1050" y2="320" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
    <circle cx="1050" cy="320" r="2" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Competitor comparison grid -->
  <g transform="translate(920, 160)" opacity="0.2">
    <!-- Grid cells -->
    <rect x="0" y="0" width="80" height="35" rx="4" fill="#FFFFFF" opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="90" y="0" width="80" height="35" rx="4" fill="#FFFFFF" opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="0" y="45" width="80" height="35" rx="4" fill="#FF6B35" opacity="0.3" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.2"/>
    <rect x="90" y="45" width="80" height="35" rx="4" fill="#FFFFFF" opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="0" y="90" width="80" height="35" rx="4" fill="#FFFFFF" opacity="0.15" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="90" y="90" width="80" height="35" rx="4" fill="#FFD166" opacity="0.2" stroke="#FFD166" stroke-width="0.5" stroke-opacity="0.1"/>

    <!-- Mini bar charts in cells -->
    <rect x="10" y="15" width="15" height="12" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="30" y="10" width="15" height="17" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="50" y="18" width="15" height="9" rx="1" fill="#FFFFFF" opacity="0.2"/>

    <rect x="100" y="12" width="15" height="15" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="120" y="8" width="15" height="19" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="140" y="15" width="15" height="12" rx="1" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Floating data nodes -->
  <circle cx="660" cy="200" r="3" fill="#FFD166" opacity="0.3"/>
  <circle cx="640" cy="350" r="4" fill="#FF6B35" opacity="0.25"/>
  <circle cx="870" cy="480" r="3" fill="#FFD166" opacity="0.2"/>
  <circle cx="1100" cy="450" r="5" fill="#FF6B35" opacity="0.15"/>
  <circle cx="550" cy="280" r="2" fill="#FFFFFF" opacity="0.15"/>

  <!-- Connecting dotted lines -->
  <line x1="660" y1="200" x2="640" y2="350" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,6" opacity="0.08"/>
  <line x1="870" y1="480" x2="1100" y2="450" stroke="#FF6B35" stroke-width="1" stroke-dasharray="4,6" opacity="0.1"/>

  <!-- Accent line -->
  <line x1="80" y1="530" x2="450" y2="530" stroke="#FF6B35" stroke-width="2" opacity="0.3"/>
  <circle cx="80" cy="530" r="4" fill="#FF6B35" opacity="0.5"/>

  <!-- Title text -->
  <text x="80" y="140" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Shopify Competitor</text>
  <text x="80" y="200" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FF6B35" letter-spacing="-1">Analysis</text>

  <!-- Subtitle -->
  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.5">Extract and compare competitor data at scale</text>

  <!-- Clymin brand -->
  <text x="1120" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>