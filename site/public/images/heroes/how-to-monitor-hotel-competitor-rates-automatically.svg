<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <!-- Automation loop/cycle -->
  <circle cx="600" cy="320" r="160" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.3" stroke-dasharray="10,5"/>
  <circle cx="600" cy="320" r="120" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.2"/>
  <!-- Rotation arrows -->
  <path d="M600 160 Q760 160 760 320" stroke="#FF6B35" stroke-width="2" fill="none" opacity="0.5"/>
  <polygon points="755,310 765,325 750,325" fill="#FF6B35" opacity="0.5"/>
  <path d="M760 320 Q760 480 600 480" stroke="#FF6B35" stroke-width="2" fill="none" opacity="0.5"/>
  <polygon points="610,475 595,485 595,470" fill="#FF6B35" opacity="0.5"/>
  <path d="M600 480 Q440 480 440 320" stroke="#FF6B35" stroke-width="2" fill="none" opacity="0.5"/>
  <polygon points="445,330 435,315 450,315" fill="#FF6B35" opacity="0.5"/>
  <path d="M440 320 Q440 160 600 160" stroke="#FF6B35" stroke-width="2" fill="none" opacity="0.5"/>
  <polygon points="590,165 605,155 605,170" fill="#FF6B35" opacity="0.5"/>
  <!-- Hotel shapes at compass points -->
  <!-- Top hotel -->
  <rect x="570" y="140" width="60" height="50" rx="3" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <rect x="578" y="150" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.4"/>
  <rect x="595" y="150" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="612" y="150" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="578" y="165" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="595" y="165" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.4"/>
  <rect x="612" y="165" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <text x="600" y="130" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.6">$199</text>
  <!-- Right hotel -->
  <rect x="760" y="295" width="60" height="50" rx="3" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <rect x="768" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="785" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="802" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.4"/>
  <rect x="768" y="320" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="785" y="320" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="802" y="320" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <text x="790" y="290" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.6">$245</text>
  <!-- Bottom hotel -->
  <rect x="570" y="475" width="60" height="50" rx="3" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <rect x="578" y="485" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="595" y="485" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.4"/>
  <rect x="612" y="485" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <text x="600" y="545" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.6">$178</text>
  <!-- Left hotel -->
  <rect x="380" y="295" width="60" height="50" rx="3" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <rect x="388" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.4"/>
  <rect x="405" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.3"/>
  <rect x="422" y="305" width="10" height="8" rx="1" fill="#FF6B35" opacity="0.5"/>
  <text x="410" y="290" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.6">$212</text>
  <!-- Center: monitoring icon -->
  <circle cx="600" cy="320" r="45" fill="#16213e" stroke="#FF6B35" stroke-width="2"/>
  <circle cx="600" cy="320" r="20" fill="#FF6B35" opacity="0.15"/>
  <!-- Eye icon for monitoring -->
  <ellipse cx="600" cy="320" rx="25" ry="15" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.7"/>
  <circle cx="600" cy="320" r="8" fill="#FF6B35" opacity="0.5"/>
  <circle cx="600" cy="320" r="3" fill="#FF6B35" opacity="0.8"/>
  <!-- Pulse rings -->
  <circle cx="600" cy="320" r="60" fill="none" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
  <circle cx="600" cy="320" r="80" fill="none" stroke="#FF6B35" stroke-width="0.5" opacity="0.1"/>
  <!-- Label: AUTO -->
  <text x="600" y="375" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FF6B35" text-anchor="middle" opacity="0.7">AUTOMATED</text>
  <!-- Scattered data particles -->
  <circle cx="180" cy="200" r="3" fill="#FF6B35" opacity="0.4"/>
  <circle cx="1020" cy="200" r="3" fill="#FF6B35" opacity="0.3"/>
  <circle cx="200" cy="450" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="1000" cy="430" r="3" fill="#FF6B35" opacity="0.35"/>
  <circle cx="150" cy="340" r="3" fill="#FF6B35" opacity="0.4"/>
  <circle cx="1050" cy="310" r="3" fill="#FF6B35" opacity="0.45"/>
  <!-- Title -->
  <text x="600" y="50" font-family="Inter, sans-serif" font-weight="700" font-size="34" fill="#ffffff" text-anchor="middle">How to Monitor Hotel Competitor</text>
  <text x="600" y="90" font-family="Inter, sans-serif" font-weight="700" font-size="34" fill="#ffffff" text-anchor="middle">Rates Automatically</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>
