<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Data Accuracy</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Precision-verified hotel pricing intelligence</text>
  <!-- Large accuracy gauge (center-left) -->
  <circle cx="320" cy="320" r="120" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <!-- Gauge background arc -->
  <path d="M 210,370 A 120,120 0 1,1 430,370" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.1"/>
  <!-- Gauge filled arc (99.2%) -->
  <path d="M 210,370 A 120,120 0 1,1 428,358" fill="none" stroke="#FF6B35" stroke-width="6" opacity="0.7"/>
  <!-- Gauge needle -->
  <line x1="320" y1="320" x2="425" y2="348" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="320" cy="320" r="8" fill="#FF6B35"/>
  <circle cx="320" cy="320" r="4" fill="#1a1a2e"/>
  <!-- Gauge reading -->
  <text x="320" y="290" font-family="Inter, sans-serif" font-size="48" fill="#ffffff" text-anchor="middle" font-weight="700">99.2%</text>
  <text x="320" y="310" font-family="Inter, sans-serif" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.8">Accuracy Rate</text>
  <!-- Gauge scale labels -->
  <text x="215" y="395" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.3">0%</text>
  <text x="200" y="310" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.3">25%</text>
  <text x="320" y="195" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.3">50%</text>
  <text x="440" y="310" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.3">75%</text>
  <text x="425" y="395" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.3">100%</text>
  <!-- Quality badge -->
  <rect x="250" y="430" width="140" height="40" rx="8" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="320" y="455" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">&#10003; Verified</text>
  <!-- Data verification flow (right side) -->
  <!-- Pipeline stages -->
  <rect x="560" y="170" width="200" height="50" rx="8" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="660" y="195" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">1. Raw Data Collection</text>
  <text x="660" y="210" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.5">Multi-source extraction</text>
  <!-- Checkmark -->
  <circle cx="780" cy="195" r="10" fill="#FF6B35" opacity="0.2"/>
  <text x="780" y="200" font-family="Inter, sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">&#10003;</text>
  <!-- Arrow down -->
  <line x1="660" y1="220" x2="660" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
  <polygon points="655,248 660,256 665,248" fill="#FF6B35" opacity="0.4"/>
  <rect x="560" y="260" width="200" height="50" rx="8" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="660" y="285" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">2. Format Validation</text>
  <text x="660" y="300" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.5">Schema compliance check</text>
  <circle cx="780" cy="285" r="10" fill="#FF6B35" opacity="0.2"/>
  <text x="780" y="290" font-family="Inter, sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">&#10003;</text>
  <line x1="660" y1="310" x2="660" y2="340" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
  <polygon points="655,338 660,346 665,338" fill="#FF6B35" opacity="0.4"/>
  <rect x="560" y="350" width="200" height="50" rx="8" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="660" y="375" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">3. Cross-Reference</text>
  <text x="660" y="390" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.5">Multi-source verification</text>
  <circle cx="780" cy="375" r="10" fill="#FF6B35" opacity="0.2"/>
  <text x="780" y="380" font-family="Inter, sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">&#10003;</text>
  <line x1="660" y1="400" x2="660" y2="430" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
  <polygon points="655,428 660,436 665,428" fill="#FF6B35" opacity="0.4"/>
  <rect x="560" y="440" width="200" height="50" rx="8" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="660" y="465" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.7">4. Anomaly Detection</text>
  <text x="660" y="480" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" text-anchor="middle" opacity="0.5">Statistical outlier filter</text>
  <circle cx="780" cy="465" r="10" fill="#FF6B35" opacity="0.2"/>
  <text x="780" y="470" font-family="Inter, sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">&#10003;</text>
  <!-- Stats panel (far right) -->
  <rect x="840" y="180" width="270" height="300" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="975" y="210" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">Quality Metrics</text>
  <line x1="860" y1="222" x2="1090" y2="222" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <!-- Metric rows -->
  <text x="870" y="252" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Price Match Rate</text>
  <text x="1080" y="252" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">99.2%</text>
  <line x1="860" y1="265" x2="1090" y2="265" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="870" y="290" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Data Freshness</text>
  <text x="1080" y="290" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">&lt;15min</text>
  <line x1="860" y1="303" x2="1090" y2="303" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="870" y="328" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Coverage</text>
  <text x="1080" y="328" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">98.7%</text>
  <line x1="860" y1="341" x2="1090" y2="341" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="870" y="366" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Uptime</text>
  <text x="1080" y="366" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">99.9%</text>
  <line x1="860" y1="379" x2="1090" y2="379" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="870" y="404" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">False Positive Rate</text>
  <text x="1080" y="404" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">0.3%</text>
  <line x1="860" y1="417" x2="1090" y2="417" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="870" y="442" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Avg Response Time</text>
  <text x="1080" y="442" font-family="Inter, sans-serif" font-size="14" fill="#4ade80" text-anchor="end" font-weight="700">1.2s</text>
  <!-- Floating particles -->
  <circle cx="500" cy="250" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="520" cy="400" r="2.5" fill="#FF6B35" opacity="0.45"/>
  <circle cx="830" cy="300" r="2" fill="#FF6B35" opacity="0.4"/>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>