<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="ca-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ca-bg)"/>

  <!-- Hex grid pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="0.5" fill="none">
    <polygon points="870,80 900,60 930,80 930,110 900,130 870,110"/>
    <polygon points="930,80 960,60 990,80 990,110 960,130 930,110"/>
    <polygon points="990,80 1020,60 1050,80 1050,110 1020,130 990,110"/>
    <polygon points="900,130 930,110 960,130 960,160 930,180 900,160"/>
    <polygon points="960,130 990,110 1020,130 1020,160 990,180 960,160"/>
    <polygon points="870,180 900,160 930,180 930,210 900,230 870,210"/>
    <polygon points="930,180 960,160 990,180 990,210 960,230 930,210"/>
    <polygon points="990,180 1020,160 1050,180 1050,210 1020,230 990,210"/>
  </g>

  <!-- Radar/Spider chart -->
  <g transform="translate(850, 370)">
    <!-- Concentric pentagons -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08">
      <polygon points="0,-140 133,-43 82,113 -82,113 -133,-43"/>
      <polygon points="0,-105 100,-32 62,85 -62,85 -100,-32"/>
      <polygon points="0,-70 66,-22 41,57 -41,57 -66,-22"/>
      <polygon points="0,-35 33,-11 21,28 -21,28 -33,-11"/>
    </g>
    <!-- Axis lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-140"/>
      <line x1="0" y1="0" x2="133" y2="-43"/>
      <line x1="0" y1="0" x2="82" y2="113"/>
      <line x1="0" y1="0" x2="-82" y2="113"/>
      <line x1="0" y1="0" x2="-133" y2="-43"/>
    </g>
    <!-- Data shape 1 (Competitor A) -->
    <polygon points="0,-120 110,-30 50,90 -70,80 -100,-35" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-width="2"/>
    <!-- Data shape 2 (Competitor B) -->
    <polygon points="0,-80 80,-38 75,60 -40,100 -120,-20" fill="#FFD166" fill-opacity="0.1" stroke="#FFD166" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Data points -->
    <circle cx="0" cy="-120" r="5" fill="#FF6B35"/>
    <circle cx="110" cy="-30" r="5" fill="#FF6B35"/>
    <circle cx="50" cy="90" r="5" fill="#FF6B35"/>
    <circle cx="-70" cy="80" r="5" fill="#FF6B35"/>
    <circle cx="-100" cy="-35" r="5" fill="#FF6B35"/>
    <circle cx="0" cy="-80" r="4" fill="#FFD166"/>
    <circle cx="80" cy="-38" r="4" fill="#FFD166"/>
    <circle cx="75" cy="60" r="4" fill="#FFD166"/>
    <circle cx="-40" cy="100" r="4" fill="#FFD166"/>
    <circle cx="-120" cy="-20" r="4" fill="#FFD166"/>
    <!-- Axis labels -->
    <text x="0" y="-155" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.5" text-anchor="middle">PRICE</text>
    <text x="150" y="-40" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.5" text-anchor="start">QUALITY</text>
    <text x="95" y="125" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.5" text-anchor="start">REVIEWS</text>
    <text x="-95" y="125" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.5" text-anchor="end">SHIPPING</text>
    <text x="-150" y="-40" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.5" text-anchor="end">RANGE</text>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(160, 420)" opacity="0.25">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFD166" stroke-width="3"/>
    <line x1="35" y1="35" x2="70" y2="70" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <!-- Grid inside magnifier -->
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
    <line x1="-30" y1="15" x2="30" y2="15" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
    <line x1="-10" y1="-35" x2="-10" y2="35" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="-35" x2="10" y2="35" stroke="#FFD166" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Comparison grid (left side) -->
  <g transform="translate(80, 320)" opacity="0.2">
    <rect x="0" y="0" width="180" height="30" rx="3" fill="#FFFFFF" opacity="0.1"/>
    <rect x="0" y="35" width="180" height="30" rx="3" fill="#FF6B35" opacity="0.15"/>
    <rect x="0" y="70" width="180" height="30" rx="3" fill="#FFFFFF" opacity="0.1"/>
    <!-- Row indicators -->
    <rect x="10" y="10" width="50" height="10" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="70" y="10" width="30" height="10" rx="2" fill="#FF6B35" opacity="0.5"/>
    <rect x="110" y="10" width="30" height="10" rx="2" fill="#FFD166" opacity="0.5"/>
    <rect x="10" y="45" width="50" height="10" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="70" y="45" width="40" height="10" rx="2" fill="#FF6B35" opacity="0.5"/>
    <rect x="110" y="45" width="20" height="10" rx="2" fill="#FFD166" opacity="0.5"/>
    <rect x="10" y="80" width="50" height="10" rx="2" fill="#FFFFFF" opacity="0.3"/>
    <rect x="70" y="80" width="25" height="10" rx="2" fill="#FF6B35" opacity="0.5"/>
    <rect x="110" y="80" width="35" height="10" rx="2" fill="#FFD166" opacity="0.5"/>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 540)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#FF6B35"/>
    <text x="20" y="11" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">Your Store</text>
    <rect x="110" y="0" width="12" height="12" rx="2" fill="#FFD166"/>
    <text x="130" y="11" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">Competitor</text>
  </g>

  <!-- Corner accents -->
  <g opacity="0.12">
    <rect x="30" y="30" width="70" height="2" fill="#FF6B35"/>
    <rect x="30" y="30" width="2" height="70" fill="#FF6B35"/>
    <rect x="1100" y="598" width="70" height="2" fill="#FFD166"/>
    <rect x="1168" y="540" width="2" height="60" fill="#FFD166"/>
  </g>

  <!-- Title text -->
  <text x="80" y="150" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Competitive</text>
  <text x="80" y="215" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#FF6B35" letter-spacing="-1">Analysis</text>

  <!-- Subtitle -->
  <text x="80" y="260" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" letter-spacing="3">WEB SCRAPING INTELLIGENCE</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>