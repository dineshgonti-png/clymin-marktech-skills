<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Booking.com Scraping</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Automated hotel listing and rate data extraction</text>
  <!-- Platform interface silhouette (left) -->
  <rect x="80" y="150" width="340" height="380" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <!-- Search bar -->
  <rect x="100" y="170" width="300" height="30" rx="6" fill="#1a1a2e" stroke="#FF6B35" stroke-width="1" opacity="0.5"/>
  <text x="115" y="190" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.3">Search destinations...</text>
  <!-- Hotel listing card 1 -->
  <rect x="100" y="215" width="300" height="80" rx="6" fill="#1a1a2e" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <rect x="110" y="225" width="60" height="60" rx="4" fill="#FF6B35" opacity="0.15"/>
  <text x="140" y="260" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.4">&#9744;</text>
  <text x="185" y="242" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">Grand Hotel Plaza</text>
  <text x="185" y="258" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Downtown - 0.3 km</text>
  <text x="185" y="275" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">&#9733; 8.7 Excellent</text>
  <text x="370" y="250" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" font-weight="700" text-anchor="end">$189</text>
  <text x="370" y="268" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" opacity="0.4">per night</text>
  <!-- Hotel listing card 2 -->
  <rect x="100" y="305" width="300" height="80" rx="6" fill="#1a1a2e" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <rect x="110" y="315" width="60" height="60" rx="4" fill="#FF6B35" opacity="0.15"/>
  <text x="140" y="350" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.4">&#9744;</text>
  <text x="185" y="332" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">Seaside Resort</text>
  <text x="185" y="348" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Beachfront - 1.2 km</text>
  <text x="185" y="365" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">&#9733; 9.1 Superb</text>
  <text x="370" y="340" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" font-weight="700" text-anchor="end">$245</text>
  <text x="370" y="358" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" opacity="0.4">per night</text>
  <!-- Hotel listing card 3 -->
  <rect x="100" y="395" width="300" height="80" rx="6" fill="#1a1a2e" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
  <rect x="110" y="405" width="60" height="60" rx="4" fill="#FF6B35" opacity="0.15"/>
  <text x="140" y="440" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.4">&#9744;</text>
  <text x="185" y="422" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">City View Suites</text>
  <text x="185" y="438" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Midtown - 0.8 km</text>
  <text x="185" y="455" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">&#9733; 7.9 Good</text>
  <text x="370" y="430" font-family="Inter, sans-serif" font-size="16" fill="#FF6B35" font-weight="700" text-anchor="end">$156</text>
  <text x="370" y="448" font-family="Inter, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" opacity="0.4">per night</text>
  <!-- Extraction arrows flowing right -->
  <line x1="420" y1="255" x2="540" y2="230" stroke="#FF6B35" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="420" y1="345" x2="540" y2="300" stroke="#FF6B35" stroke-width="2" opacity="0.6" stroke-dasharray="6,4"/>
  <line x1="420" y1="435" x2="540" y2="370" stroke="#FF6B35" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
  <!-- Data particles in transit -->
  <circle cx="460" cy="240" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="490" cy="310" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="470" cy="380" r="3" fill="#FF6B35" opacity="0.55"/>
  <circle cx="510" cy="260" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="520" cy="350" r="2" fill="#FF6B35" opacity="0.45"/>
  <!-- Data pipeline tube -->
  <rect x="540" y="200" width="40" height="200" rx="20" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.4"/>
  <rect x="548" y="220" width="24" height="160" rx="12" fill="#FF6B35" opacity="0.08"/>
  <!-- Small dots inside pipeline -->
  <circle cx="560" cy="240" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="560" cy="270" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="560" cy="300" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="560" cy="330" r="3" fill="#FF6B35" opacity="0.7"/>
  <circle cx="560" cy="360" r="3" fill="#FF6B35" opacity="0.5"/>
  <!-- Output arrows from pipeline -->
  <line x1="580" y1="270" x2="680" y2="230" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="580" y1="300" x2="680" y2="300" stroke="#FF6B35" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="580" y1="330" x2="680" y2="370" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Structured data output (right side) -->
  <rect x="680" y="170" width="420" height="320" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="890" y="200" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">Extracted Data</text>
  <line x1="700" y1="212" x2="1080" y2="212" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <!-- Table headers -->
  <text x="720" y="235" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">Property</text>
  <text x="840" y="235" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">Rate</text>
  <text x="910" y="235" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">Rating</text>
  <text x="990" y="235" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">Avail.</text>
  <line x1="700" y1="245" x2="1080" y2="245" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <!-- Data rows -->
  <text x="720" y="268" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">Grand Hotel Plaza</text>
  <text x="840" y="268" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">$189</text>
  <text x="910" y="268" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">8.7</text>
  <text x="990" y="268" font-family="Inter, sans-serif" font-size="11" fill="#4ade80" opacity="0.6">Yes</text>
  <line x1="700" y1="278" x2="1080" y2="278" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="720" y="298" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">Seaside Resort</text>
  <text x="840" y="298" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">$245</text>
  <text x="910" y="298" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">9.1</text>
  <text x="990" y="298" font-family="Inter, sans-serif" font-size="11" fill="#4ade80" opacity="0.6">Yes</text>
  <line x1="700" y1="308" x2="1080" y2="308" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="720" y="328" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">City View Suites</text>
  <text x="840" y="328" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.7">$156</text>
  <text x="910" y="328" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.5">7.9</text>
  <text x="990" y="328" font-family="Inter, sans-serif" font-size="11" fill="#4ade80" opacity="0.6">Yes</text>
  <line x1="700" y1="338" x2="1080" y2="338" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="720" y="358" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.4">Harbor Inn</text>
  <text x="840" y="358" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.5">$134</text>
  <text x="910" y="358" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.4">7.2</text>
  <text x="990" y="358" font-family="Inter, sans-serif" font-size="11" fill="#f87171" opacity="0.5">No</text>
  <line x1="700" y1="368" x2="1080" y2="368" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="720" y="388" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.4">Palm Court Hotel</text>
  <text x="840" y="388" font-family="Inter, sans-serif" font-size="11" fill="#FF6B35" opacity="0.5">$210</text>
  <text x="910" y="388" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" opacity="0.4">8.3</text>
  <text x="990" y="388" font-family="Inter, sans-serif" font-size="11" fill="#4ade80" opacity="0.5">Yes</text>
  <!-- Record count -->
  <text x="890" y="470" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.6">2,847 listings extracted</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>