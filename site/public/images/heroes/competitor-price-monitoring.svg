<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#1a1a35"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Radial background accents -->
  <circle cx="850" cy="280" r="220" fill="#FF6B35" opacity="0.04"/>
  <circle cx="850" cy="280" r="150" fill="#FF6B35" opacity="0.03"/>

  <!-- Central monitoring hub -->
  <g transform="translate(850, 280)">
    <!-- Outer ring pulse -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.1"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.15"/>
    <!-- Hub body -->
    <circle cx="0" cy="0" r="42" fill="#FF6B35" opacity="0.12" stroke="#FF6B35" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="#FF6B35" opacity="0.2"/>
    <!-- Hub icon (eye/monitor) -->
    <ellipse cx="0" cy="0" rx="16" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="0" cy="0" r="2" fill="#FF6B35"/>
  </g>

  <!-- Storefront 1 (top-right) -->
  <g transform="translate(1050, 120)">
    <!-- Connection line to hub -->
    <line x1="0" y1="40" x2="-160" y2="130" stroke="#FF6B35" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
    <!-- Data pulse dots along line -->
    <circle cx="-50" cy="70" r="2.5" fill="#FF6B35" opacity="0.5"/>
    <circle cx="-100" cy="100" r="2" fill="#FFD166" opacity="0.4"/>
    <!-- Storefront -->
    <rect x="-50" y="0" width="100" height="70" rx="6" fill="#FFFFFF" opacity="0.05" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="-50" y="0" width="100" height="18" rx="6" fill="#FF6B35" opacity="0.15"/>
    <rect x="-35" y="25" width="30" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <!-- Price tag -->
    <rect x="10" y="22" width="35" height="16" rx="3" fill="#FFD166" opacity="0.15" stroke="#FFD166" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="27" y="34" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFD166" text-anchor="middle" opacity="0.7">$34</text>
    <rect x="-35" y="45" width="70" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
    <rect x="-35" y="55" width="45" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- Storefront 2 (right) -->
  <g transform="translate(1080, 320)">
    <!-- Connection line to hub -->
    <line x1="-40" y1="0" x2="-190" y2="-40" stroke="#FFD166" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
    <circle cx="-90" cy="-15" r="2.5" fill="#FFD166" opacity="0.5"/>
    <circle cx="-140" cy="-28" r="2" fill="#FF6B35" opacity="0.4"/>
    <!-- Storefront -->
    <rect x="-40" y="-35" width="100" height="70" rx="6" fill="#FFFFFF" opacity="0.05" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="-40" y="-35" width="100" height="18" rx="6" fill="#FFD166" opacity="0.1"/>
    <rect x="-25" y="-10" width="30" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <!-- Price tag -->
    <rect x="20" y="-13" width="35" height="16" rx="3" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="37" y="-1" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle" opacity="0.7">$29</text>
    <rect x="-25" y="10" width="65" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
    <rect x="-25" y="20" width="40" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- Storefront 3 (bottom-right) -->
  <g transform="translate(1000, 480)">
    <!-- Connection line to hub -->
    <line x1="0" y1="-20" x2="-120" y2="-170" stroke="#FF6B35" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
    <circle cx="-40" cy="-70" r="2.5" fill="#FF6B35" opacity="0.5"/>
    <circle cx="-80" cy="-120" r="2" fill="#FFD166" opacity="0.4"/>
    <!-- Storefront -->
    <rect x="-50" y="-20" width="100" height="70" rx="6" fill="#FFFFFF" opacity="0.05" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="-50" y="-20" width="100" height="18" rx="6" fill="#FFFFFF" opacity="0.06"/>
    <rect x="-35" y="5" width="30" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <!-- Price tag -->
    <rect x="10" y="2" width="35" height="16" rx="3" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="27" y="14" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle" opacity="0.7">$41</text>
    <rect x="-35" y="25" width="55" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
    <rect x="-35" y="35" width="35" height="5" rx="2.5" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- Storefront 4 (top, near center) -->
  <g transform="translate(750, 90)">
    <!-- Connection line to hub -->
    <line x1="30" y1="60" x2="80" y2="150" stroke="#FFD166" stroke-width="1.5" opacity="0.2" stroke-dasharray="6,4"/>
    <circle cx="50" cy="95" r="2.5" fill="#FFD166" opacity="0.5"/>
    <circle cx="65" cy="125" r="2" fill="#FF6B35" opacity="0.4"/>
    <!-- Storefront -->
    <rect x="-40" y="0" width="90" height="60" rx="6" fill="#FFFFFF" opacity="0.05" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="-40" y="0" width="90" height="16" rx="6" fill="#FFD166" opacity="0.1"/>
    <rect x="-28" y="22" width="25" height="7" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <rect x="5" y="20" width="32" height="14" rx="3" fill="#FFD166" opacity="0.15" stroke="#FFD166" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="21" y="30" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#FFD166" text-anchor="middle" opacity="0.7">$37</text>
    <rect x="-28" y="40" width="60" height="4" rx="2" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- Real-time data feed lines (animated feel) -->
  <g opacity="0.06">
    <!-- Horizontal scan lines -->
    <rect x="600" y="200" width="500" height="1" fill="#FF6B35"/>
    <rect x="650" y="250" width="400" height="1" fill="#FFD166"/>
    <rect x="620" y="300" width="460" height="1" fill="#FF6B35"/>
    <rect x="660" y="350" width="380" height="1" fill="#FFD166"/>
    <rect x="610" y="400" width="480" height="1" fill="#FF6B35"/>
  </g>

  <!-- Signal/radar waves from hub -->
  <g transform="translate(850, 280)" opacity="0.06">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FFD166" stroke-width="1"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FFD166" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#FFD166" stroke-width="0.5"/>
  </g>

  <!-- Floating data particles -->
  <circle cx="680" cy="150" r="3" fill="#FF6B35" opacity="0.3"/>
  <circle cx="720" cy="430" r="2" fill="#FFD166" opacity="0.25"/>
  <circle cx="950" cy="200" r="2" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="780" cy="450" r="3" fill="#FF6B35" opacity="0.2"/>
  <circle cx="1100" cy="250" r="2" fill="#FFD166" opacity="0.2"/>

  <!-- Left side decorative network -->
  <g opacity="0.06">
    <circle cx="150" cy="150" r="3" fill="#FF6B35"/>
    <circle cx="200" cy="120" r="2" fill="#FFD166"/>
    <circle cx="250" cy="160" r="3" fill="#FF6B35"/>
    <circle cx="180" cy="200" r="2" fill="#FFFFFF"/>
    <line x1="150" y1="150" x2="200" y2="120" stroke="#FF6B35" stroke-width="0.8"/>
    <line x1="200" y1="120" x2="250" y2="160" stroke="#FFD166" stroke-width="0.8"/>
    <line x1="250" y1="160" x2="180" y2="200" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="150" y1="150" x2="180" y2="200" stroke="#FF6B35" stroke-width="0.8"/>
  </g>

  <!-- Orange accent bar -->
  <rect x="80" y="255" width="60" height="5" rx="2.5" fill="#FF6B35"/>
  <rect x="150" y="255" width="30" height="5" rx="2.5" fill="#FFD166" opacity="0.6"/>

  <!-- Title text -->
  <text x="80" y="315" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Competitor Price
  </text>
  <text x="80" y="378" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Monitoring
  </text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" font-weight="400">
    Real-Time Market Intelligence Hub
  </text>

  <!-- Live indicator -->
  <circle cx="90" y="0" r="4" fill="#FF6B35" opacity="0.8" transform="translate(0, 455)"/>
  <circle cx="90" y="0" r="8" fill="#FF6B35" opacity="0.2" transform="translate(0, 455)"/>
  <text x="106" y="459" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35" font-weight="600" opacity="0.6" letter-spacing="2">LIVE</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FF6B35" text-anchor="end" letter-spacing="1">
    Clymin
  </text>
</svg>