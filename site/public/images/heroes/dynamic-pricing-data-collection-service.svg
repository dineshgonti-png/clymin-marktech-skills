<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="chartLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#FF6B35"/>
      <stop offset="70%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dollarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Subtle vertical bars background -->
  <g opacity="0.03">
    <rect x="580" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="630" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="680" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="730" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="780" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="830" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="880" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="930" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="980" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="1030" y="150" width="30" height="400" fill="#FFFFFF"/>
    <rect x="1080" y="150" width="30" height="400" fill="#FFFFFF"/>
  </g>

  <!-- Chart area background -->
  <rect x="560" y="150" width="580" height="350" rx="8" fill="#FFFFFF" opacity="0.02"/>

  <!-- Y-axis grid lines -->
  <g opacity="0.06">
    <line x1="580" y1="200" x2="1120" y2="200" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="580" y1="260" x2="1120" y2="260" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="580" y1="320" x2="1120" y2="320" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="580" y1="380" x2="1120" y2="380" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="580" y1="440" x2="1120" y2="440" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,8"/>
  </g>

  <!-- Y-axis price labels -->
  <text x="570" y="205" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.2" text-anchor="end">$120</text>
  <text x="570" y="265" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.2" text-anchor="end">$100</text>
  <text x="570" y="325" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.2" text-anchor="end">$80</text>
  <text x="570" y="385" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.2" text-anchor="end">$60</text>
  <text x="570" y="445" font-family="monospace" font-size="10" fill="#FFFFFF" opacity="0.2" text-anchor="end">$40</text>

  <!-- Main price line chart (fluctuating) -->
  <path d="M600,380 L640,360 L680,370 L720,320 L760,290 L800,310 L840,260 L880,240 L920,280 L960,250 L1000,220 L1040,240 L1080,200 L1100,210"
    fill="none" stroke="url(#chartLineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Area fill under main line -->
  <path d="M600,380 L640,360 L680,370 L720,320 L760,290 L800,310 L840,260 L880,240 L920,280 L960,250 L1000,220 L1040,240 L1080,200 L1100,210 L1100,480 L600,480 Z"
    fill="url(#chartFill)"/>

  <!-- Secondary line (competitor pricing) -->
  <path d="M600,340 L640,350 L680,330 L720,340 L760,320 L800,330 L840,310 L880,320 L920,300 L960,310 L1000,290 L1040,300 L1080,280 L1100,285"
    fill="none" stroke="#FFD166" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.35" stroke-linecap="round"/>

  <!-- Data points on main line -->
  <circle cx="720" cy="320" r="4" fill="#FF6B35" opacity="0.7"/>
  <circle cx="840" cy="260" r="4" fill="#FF6B35" opacity="0.7"/>
  <circle cx="960" cy="250" r="5" fill="#FF6B35" opacity="0.9"/>
  <circle cx="1080" cy="200" r="4" fill="#FFD166" opacity="0.8"/>

  <!-- Price change callout at peak -->
  <g transform="translate(940, 215)">
    <rect x="0" y="0" width="65" height="24" rx="12" fill="#FF6B35" opacity="0.25"/>
    <text x="33" y="16" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF6B35" text-anchor="middle">+18.5%</text>
  </g>

  <!-- Up/Down arrows -->
  <g transform="translate(1080, 170)">
    <!-- Up arrow -->
    <polygon points="15,0 25,15 20,15 20,28 10,28 10,15 5,15" fill="#FFD166" opacity="0.5"/>
  </g>
  <g transform="translate(720, 340)">
    <!-- Down arrow -->
    <polygon points="15,28 25,13 20,13 20,0 10,0 10,13 5,13" fill="#FF6B35" opacity="0.3"/>
  </g>

  <!-- Abstract dollar signs -->
  <text x="620" y="200" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" fill="#FFD166" opacity="0.06">$</text>
  <text x="900" y="480" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="800" fill="#FF6B35" opacity="0.04">$</text>
  <text x="1050" y="380" font-family="Inter, system-ui, sans-serif" font-size="45" font-weight="800" fill="#FFD166" opacity="0.05">$</text>

  <!-- Mini sparklines for context -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#FFFFFF" opacity="0.04"/>
    <text x="12" y="18" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.3">AVG PRICE</text>
    <text x="12" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FF6B35" opacity="0.7">$94.50</text>
    <polyline points="120,40 130,35 140,38 150,28 160,30" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
  </g>

  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#FFFFFF" opacity="0.04"/>
    <text x="12" y="18" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.3">VOLATILITY</text>
    <text x="12" y="40" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFD166" opacity="0.6">23.4%</text>
    <polyline points="120,30 128,38 136,25 144,42 152,20 160,35" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Floating decorative elements -->
  <circle cx="500" cy="300" r="3" fill="#FF6B35" opacity="0.2"/>
  <circle cx="520" cy="180" r="4" fill="#FFD166" opacity="0.15"/>
  <rect x="490" y="420" width="12" height="12" rx="2" fill="#FF6B35" opacity="0.1" transform="rotate(45,496,426)"/>

  <!-- Accent line -->
  <line x1="80" y1="530" x2="380" y2="530" stroke="#FF6B35" stroke-width="2" opacity="0.3"/>
  <circle cx="80" cy="530" r="4" fill="#FF6B35" opacity="0.5"/>

  <!-- Title text -->
  <text x="80" y="130" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Dynamic Pricing</text>
  <text x="80" y="190" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FF6B35" letter-spacing="-1">Data</text>

  <!-- Subtitle -->
  <text x="80" y="230" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.5">Track price fluctuations and market dynamics</text>

  <!-- Clymin brand -->
  <text x="1120" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>