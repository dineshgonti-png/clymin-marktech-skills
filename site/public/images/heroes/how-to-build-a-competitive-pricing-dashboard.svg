<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Background glow -->
  <circle cx="900" cy="315" r="350" fill="#FF6B35" opacity="0.03"/>
  <circle cx="300" cy="500" r="200" fill="#FFD166" opacity="0.02"/>

  <!-- Dashboard frame -->
  <rect x="560" y="60" width="580" height="400" rx="12" fill="#FFFFFF" opacity="0.04" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Dashboard top bar -->
  <rect x="560" y="60" width="580" height="40" rx="12" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="585" cy="80" r="6" fill="#FF6B35" opacity="0.6"/>
  <circle cx="605" cy="80" r="6" fill="#FFD166" opacity="0.6"/>
  <circle cx="625" cy="80" r="6" fill="#FFFFFF" opacity="0.2"/>
  <rect x="750" y="74" width="200" height="12" rx="6" fill="#FFFFFF" opacity="0.06"/>

  <!-- KPI Card 1 -->
  <rect x="585" y="118" width="160" height="85" rx="8" fill="url(#cardGlow)" stroke="#FF6B35" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="600" y="142" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FF6B35" opacity="0.7" font-weight="500">AVG PRICE</text>
  <text x="600" y="172" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700">$42.99</text>
  <text x="600" y="192" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">+12.4%</text>
  <!-- Mini sparkline -->
  <polyline points="700,190 710,182 720,186 730,175 740,178" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>

  <!-- KPI Card 2 -->
  <rect x="760" y="118" width="160" height="85" rx="8" fill="#FFFFFF" opacity="0.04" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08"/>
  <text x="775" y="142" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFD166" opacity="0.7" font-weight="500">COMPETITORS</text>
  <text x="775" y="172" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700">247</text>
  <text x="775" y="192" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFD166" opacity="0.6">+18 new</text>

  <!-- KPI Card 3 -->
  <rect x="935" y="118" width="180" height="85" rx="8" fill="#FFFFFF" opacity="0.04" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08"/>
  <text x="950" y="142" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.4" font-weight="500">PRICE INDEX</text>
  <text x="950" y="172" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700">98.7</text>
  <text x="950" y="192" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6">-1.3 pts</text>

  <!-- Chart area -->
  <rect x="585" y="220" width="530" height="220" rx="8" fill="#FFFFFF" opacity="0.03"/>

  <!-- Chart grid lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.05">
    <line x1="620" y1="250" x2="1090" y2="250"/>
    <line x1="620" y1="290" x2="1090" y2="290"/>
    <line x1="620" y1="330" x2="1090" y2="330"/>
    <line x1="620" y1="370" x2="1090" y2="370"/>
    <line x1="620" y1="410" x2="1090" y2="410"/>
  </g>

  <!-- Y-axis labels -->
  <text x="610" y="254" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.2" text-anchor="end">$80</text>
  <text x="610" y="294" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.2" text-anchor="end">$60</text>
  <text x="610" y="334" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.2" text-anchor="end">$40</text>
  <text x="610" y="374" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.2" text-anchor="end">$20</text>

  <!-- Price trend line 1 (orange - your price) -->
  <polyline points="630,350 670,340 710,345 750,320 790,310 830,325 870,300 910,290 950,285 990,270 1030,265 1070,260" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Price trend line 2 (yellow - competitor avg) -->
  <polyline points="630,330 670,335 710,320 750,330 790,325 830,310 870,315 910,305 950,310 990,295 1030,290 1070,285" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>

  <!-- Price trend line 3 (white - market avg) -->
  <polyline points="630,360 670,355 710,358 750,350 790,345 830,348 870,340 910,335 950,338 990,330 1030,325 1070,320" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>

  <!-- Area fill under main line -->
  <polygon points="630,350 670,340 710,345 750,320 790,310 830,325 870,300 910,290 950,285 990,270 1030,265 1070,260 1070,420 630,420" fill="#FF6B35" opacity="0.06"/>

  <!-- Data point highlights -->
  <circle cx="870" cy="300" r="4" fill="#FF6B35"/>
  <circle cx="870" cy="300" r="8" fill="#FF6B35" opacity="0.2"/>
  <circle cx="1070" cy="260" r="4" fill="#FF6B35"/>
  <circle cx="1070" cy="260" r="8" fill="#FF6B35" opacity="0.2"/>

  <!-- Legend -->
  <rect x="850" y="232" width="8" height="8" rx="2" fill="#FF6B35"/>
  <text x="864" y="240" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.4">Your Price</text>
  <rect x="930" y="232" width="8" height="8" rx="2" fill="#FFD166"/>
  <text x="944" y="240" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.4">Competitor</text>
  <rect x="1010" y="232" width="8" height="8" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <text x="1024" y="240" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.4">Market</text>

  <!-- Construction/building accent elements -->
  <g opacity="0.12">
    <!-- Crane-like structure -->
    <line x1="530" y1="480" x2="530" y2="140" stroke="#FF6B35" stroke-width="3"/>
    <line x1="530" y1="140" x2="560" y2="140" stroke="#FF6B35" stroke-width="3"/>
    <line x1="530" y1="140" x2="510" y2="120" stroke="#FFD166" stroke-width="2"/>
    <line x1="510" y1="120" x2="560" y2="140" stroke="#FFD166" stroke-width="1.5"/>
  </g>

  <!-- Floating geometric accents -->
  <rect x="120" y="120" width="20" height="20" rx="3" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.15" transform="rotate(15 130 130)"/>
  <rect x="200" y="480" width="16" height="16" rx="2" fill="#FFD166" opacity="0.08" transform="rotate(30 208 488)"/>
  <circle cx="480" cy="100" r="6" fill="#FF6B35" opacity="0.1"/>
  <circle cx="460" cy="520" r="4" fill="#FFD166" opacity="0.1"/>

  <!-- Connecting dots pattern -->
  <g opacity="0.08">
    <circle cx="100" cy="450" r="2" fill="#FFFFFF"/>
    <circle cx="140" cy="430" r="2" fill="#FFFFFF"/>
    <circle cx="180" cy="445" r="2" fill="#FFFFFF"/>
    <line x1="100" y1="450" x2="140" y2="430" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="140" y1="430" x2="180" y2="445" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>

  <!-- Orange accent bar -->
  <rect x="80" y="235" width="60" height="5" rx="2.5" fill="#FF6B35"/>
  <rect x="150" y="235" width="30" height="5" rx="2.5" fill="#FFD166" opacity="0.6"/>

  <!-- Title text -->
  <text x="80" y="295" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Build a Pricing
  </text>
  <text x="80" y="360" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Dashboard
  </text>

  <!-- Subtitle -->
  <text x="80" y="405" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" font-weight="400">
    Competitive Intelligence Platform Guide
  </text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FF6B35" text-anchor="end" letter-spacing="1">
    Clymin
  </text>
</svg>