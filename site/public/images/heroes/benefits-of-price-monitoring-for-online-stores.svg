<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pm-chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pm-arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#pm-bg)"/>

  <!-- Background diagonal lines -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="630" x2="630" y2="0"/>
    <line x1="100" y1="630" x2="730" y2="0"/>
    <line x1="200" y1="630" x2="830" y2="0"/>
    <line x1="300" y1="630" x2="930" y2="0"/>
    <line x1="400" y1="630" x2="1030" y2="0"/>
    <line x1="500" y1="630" x2="1130" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="30"/>
  </g>

  <!-- Upward trending chart area -->
  <g transform="translate(550, 100)">
    <!-- Chart background -->
    <rect x="0" y="0" width="580" height="350" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Grid lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
      <line x1="40" y1="50" x2="560" y2="50"/>
      <line x1="40" y1="125" x2="560" y2="125"/>
      <line x1="40" y1="200" x2="560" y2="200"/>
      <line x1="40" y1="275" x2="560" y2="275"/>
    </g>

    <!-- Chart area fill -->
    <path d="M60,280 L130,260 L200,250 L270,220 L340,195 L410,150 L480,110 L540,70 L540,310 L60,310 Z" fill="url(#pm-chart)"/>

    <!-- Chart line -->
    <polyline points="60,280 130,260 200,250 270,220 340,195 410,150 480,110 540,70" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data points -->
    <circle cx="60" cy="280" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="130" cy="260" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="200" cy="250" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="270" cy="220" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="340" cy="195" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="410" cy="150" r="4" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="480" cy="110" r="5" fill="#1a1a2e" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="540" cy="70" r="6" fill="#FF6B35"/>

    <!-- Checkmark badges on data points -->
    <g fill="#4ade80">
      <circle cx="340" cy="180" r="8"/>
      <path d="M336,180 L339,183 L345,177" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g fill="#4ade80">
      <circle cx="480" cy="95" r="8"/>
      <path d="M476,95 L479,98 L485,92" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g fill="#4ade80">
      <circle cx="540" cy="55" r="8"/>
      <path d="M536,55 L539,58 L545,52" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- ROI label -->
    <rect x="460" y="35" width="80" height="24" rx="12" fill="#FFD166" fill-opacity="0.2" stroke="#FFD166" stroke-width="1" stroke-opacity="0.5"/>
    <text x="500" y="51" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFD166" text-anchor="middle" font-weight="600">+127% ROI</text>
  </g>

  <!-- Big ROI growth arrow -->
  <g transform="translate(480, 480)" opacity="0.15">
    <path d="M0,0 L80,-120" stroke="url(#pm-arrow)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="80,-120 60,-105 75,-98" fill="#FFD166"/>
  </g>

  <!-- Benefit icons in circles -->
  <!-- Shield icon -->
  <g transform="translate(100, 350)">
    <circle cx="0" cy="0" r="38" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M0-20 L16-12 L16 8 C16 18 0 26 0 26 C0 26 -16 18 -16 8 L-16-12 Z" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-5,2 L-1,6 L7,-2" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="55" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5" text-anchor="middle">PROTECT</text>
  </g>

  <!-- Clock icon -->
  <g transform="translate(220, 350)">
    <circle cx="0" cy="0" r="38" fill="#FFD166" fill-opacity="0.1" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFD166" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="4" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#FFD166"/>
    <text x="0" y="55" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5" text-anchor="middle">SAVE TIME</text>
  </g>

  <!-- Dollar icon -->
  <g transform="translate(340, 350)">
    <circle cx="0" cy="0" r="38" fill="#FF6B35" fill-opacity="0.1" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="0" y="8" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#FF6B35" text-anchor="middle" font-weight="300">$</text>
    <text x="0" y="55" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5" text-anchor="middle">REVENUE</text>
  </g>

  <!-- Connecting lines between icons -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.08" stroke-dasharray="4,4">
    <line x1="140" y1="350" x2="180" y2="350"/>
    <line x1="260" y1="350" x2="300" y2="350"/>
    <line x1="380" y1="350" x2="550" y2="250"/>
  </g>

  <!-- Additional scattered checkmarks -->
  <g opacity="0.15">
    <circle cx="450" cy="300" r="10" fill="#4ade80"/>
    <path d="M445,300 L449,304 L456,297" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g opacity="0.1">
    <circle cx="500" cy="400" r="8" fill="#4ade80"/>
    <path d="M496,400 L499,403 L505,397" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.12">
    <rect x="30" y="30" width="70" height="2" fill="#FF6B35"/>
    <rect x="30" y="30" width="2" height="70" fill="#FF6B35"/>
    <rect x="1100" y="30" width="70" height="2" fill="#FFD166"/>
    <rect x="1168" y="30" width="2" height="70" fill="#FFD166"/>
  </g>

  <!-- Title text -->
  <text x="80" y="140" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Price Monitoring</text>
  <text x="80" y="205" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFD166" letter-spacing="-1">Benefits</text>

  <!-- Subtitle -->
  <text x="80" y="250" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" letter-spacing="3">FOR ONLINE STORES</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>