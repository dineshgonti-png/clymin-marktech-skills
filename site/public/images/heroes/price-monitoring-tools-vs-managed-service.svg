  <text x="1050" y="298" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#4CAF50" text-anchor="middle" opacity="0.6">LIVE</text>

  <text x="905" y="510" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#FFD166" text-anchor="middle" opacity="0.5">FULLY MANAGED</text>
  <line x1="795" y1="498" x2="1015" y2="498" stroke="#FFD166" stroke-width="0.5" opacity="0.3"/>

