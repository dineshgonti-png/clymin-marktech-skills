    <circle cx="0" cy="0" r="10" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.6"/>
    <rect x="-4" y="-28" width="8" height="12" rx="1" fill="#FFD166" opacity="0.5"/>
    <rect x="-4" y="16" width="8" height="12" rx="1" fill="#FFD166" opacity="0.5"/>
    <rect x="-28" y="-4" width="12" height="8" rx="1" fill="#FFD166" opacity="0.5"/>
    <rect x="16" y="-4" width="12" height="8" rx="1" fill="#FFD166" opacity="0.5"/>
