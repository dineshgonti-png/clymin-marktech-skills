  <line x1="425" y1="260" x2="435" y2="260" stroke="#FFD166" stroke-width="1" opacity="0.4"/>
  <line x1="430" y1="255" x2="430" y2="265" stroke="#FFD166" stroke-width="1" opacity="0.4"/>

