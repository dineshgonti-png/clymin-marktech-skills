  <text x="780" y="283" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle" opacity="0.7">PRICES</text>
  <text x="780" y="298" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.7">24.5K</text>

  <rect x="825" y="270" width="70" height="35" rx="4" fill="#FFD166" opacity="0.1"/>
  <text x="860" y="283" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFD166" text-anchor="middle" opacity="0.7">SKUS</text>
  <text x="860" y="298" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.7">8.2K</text>

  <rect x="905" y="270" width="70" height="35" rx="4" fill="#FF6B35" opacity="0.12"/>
  <text x="940" y="283" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle" opacity="0.7">ALERTS</text>
  <text x="940" y="298" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.7">47</text>

