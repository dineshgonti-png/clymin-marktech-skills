    <line x1="-15" y1="-2" x2="10" y2="-2" stroke="#FFD166" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="6" x2="12" y2="6" stroke="#FFD166" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="14" x2="8" y2="14" stroke="#FFD166" stroke-width="1" opacity="0.3"/>
