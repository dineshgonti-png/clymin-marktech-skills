  <rect x="40" y="38" width="30" height="3" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="40" y="38" width="3" height="30" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="1130" y="38" width="30" height="3" rx="1" fill="#FF6B35" opacity="0.5"/>
  <rect x="1157" y="38" width="3" height="30" rx="1" fill="#FF6B35" opacity="0.5"/>

  <!-- Clymin brand -->
  <text x="1150" y="608" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>