  <polyline points="760,420 800,390 840,400 880,360 920,370 960,330 1000,340 1040,300" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <polyline points="760,430 800,410 840,420 880,385 920,395 960,365 1000,370 1040,340" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.4"/>

  <!-- Data points on chart -->
  <circle cx="760" cy="420" r="3" fill="#FF6B35" opacity="0.8"/>
  <circle cx="840" cy="400" r="3" fill="#FF6B35" opacity="0.8"/>
  <circle cx="920" cy="370" r="3" fill="#FF6B35" opacity="0.8"/>
  <circle cx="1000" cy="340" r="3" fill="#FF6B35" opacity="0.8"/>
  <circle cx="1040" cy="300" r="3" fill="#FF6B35" opacity="0.8"/>

