    <circle cx="230" cy="30" r="1.5"/><circle cx="270" cy="30" r="1.5"/><circle cx="310" cy="30" r="1.5"/><circle cx="350" cy="30" r="1.5"/><circle cx="390" cy="30" r="1.5"/>
    <circle cx="30" cy="70" r="1.5"/><circle cx="70" cy="70" r="1.5"/><circle cx="110" cy="70" r="1.5"/><circle cx="150" cy="70" r="1.5"/><circle cx="190" cy="70" r="1.5"/>
    <circle cx="830" cy="530" r="1.5"/><circle cx="870" cy="530" r="1.5"/><circle cx="910" cy="530" r="1.5"/><circle cx="950" cy="530" r="1.5"/><circle cx="990" cy="530" r="1.5"/>
    <circle cx="1030" cy="530" r="1.5"/><circle cx="1070" cy="530" r="1.5"/><circle cx="1110" cy="530" r="1.5"/><circle cx="1150" cy="530" r="1.5"/>
    <circle cx="830" cy="570" r="1.5"/><circle cx="870" cy="570" r="1.5"/><circle cx="910" cy="570" r="1.5"/><circle cx="950" cy="570" r="1.5"/>
