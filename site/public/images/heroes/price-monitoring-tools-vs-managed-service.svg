  <rect x="740" y="228" width="8" height="8" rx="2" fill="#FF6B35" opacity="0.5"/>
  <rect x="730" y="255" width="350" height="0" rx="0" fill="none" stroke="#FFD166" stroke-width="0.5" stroke-opacity="0.2"/>
  <circle cx="748" cy="240" r="5" fill="#FF6B35" opacity="0.6"/>
  <circle cx="764" cy="240" r="5" fill="#FFD166" opacity="0.5"/>
  <circle cx="780" cy="240" r="5" fill="#FFFFFF" opacity="0.2"/>

