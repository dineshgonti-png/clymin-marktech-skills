<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg58" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg58)"/>
  <path d="M0 0 L80 0 L0 80 Z" fill="#FF6B35" opacity="0.15"/>
  <path d="M1200 630 L1120 630 L1200 550 Z" fill="#FF6B35" opacity="0.15"/>
  <!-- Title -->
  <text x="80" y="110" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Managed Scraping</text>
  <text x="80" y="165" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#FF6B35">vs DIY for Food Delivery</text>
  <text x="80" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#FFD166" letter-spacing="3">BUILD VS BUY ANALYSIS</text>
  <!-- Comparison table -->
  <rect x="620" y="70" width="520" height="280" rx="10" fill="#232345" stroke="#4ECDC4" stroke-width="1" opacity="0.8"/>
  <text x="650" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#888">TOTAL COST OF OWNERSHIP</text>
  <!-- Headers -->
  <text x="650" y="130" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#888">FACTOR</text>
  <text x="870" y="130" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">DIY</text>
  <text x="1020" y="130" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">MANAGED</text>
  <line x1="650" y1="138" x2="1110" y2="138" stroke="#333" stroke-width="0.5"/>
  <!-- Rows -->
  <text x="650" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Time to data</text>
  <text x="870" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">9-18 months</text>
  <text x="1020" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">5-7 days</text>
  <text x="650" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Annual cost</text>
  <text x="870" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">$300-600K</text>
  <text x="1020" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">Fraction</text>
  <text x="650" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Uptime</text>
  <text x="870" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">85-95%</text>
  <text x="1020" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">99%+</text>
  <text x="650" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Fix time</text>
  <text x="870" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">Hours-days</text>
  <text x="1020" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">&lt;4 hours</text>
  <text x="650" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Platforms</text>
  <text x="870" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">1-3</text>
  <text x="1020" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">15+</text>
  <text x="650" y="285" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">Engineers needed</text>
  <text x="870" y="285" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FF6B35">2-4 FTE</text>
  <text x="1020" y="285" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4ECDC4">0</text>
  <!-- Winner badge -->
  <rect x="980" y="305" width="150" height="28" rx="4" fill="#4ECDC4" opacity="0.2" stroke="#4ECDC4" stroke-width="1"/>
  <text x="1005" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ECDC4">RECOMMENDED</text>
  <!-- Cost breakdown visual -->
  <rect x="80" y="290" width="200" height="100" rx="8" fill="#232345" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="100" y="320" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">DIY ENGINEER COST</text>
  <text x="100" y="355" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FF6B35">$600K</text>
  <text x="100" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">annual maximum</text>
  <rect x="300" y="290" width="200" height="100" rx="8" fill="#232345" stroke="#4ECDC4" stroke-width="1.5"/>
  <text x="320" y="320" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">BREAKAGE RISK</text>
  <text x="320" y="355" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#4ECDC4">2-3wk</text>
  <text x="320" y="378" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">UI change cycle</text>
  <rect x="80" y="410" width="200" height="100" rx="8" fill="#232345" stroke="#FFD166" stroke-width="1.5"/>
  <text x="100" y="440" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">CLYMIN ENGINEERS</text>
  <text x="100" y="475" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFD166">50+</text>
  <text x="100" y="498" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">dedicated team</text>
  <rect x="300" y="410" width="200" height="100" rx="8" fill="#232345" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  <text x="320" y="440" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#888">DATA DELIVERY</text>
  <text x="320" y="475" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">5-7d</text>
  <text x="320" y="498" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccc">to first data</text>
  <!-- Brand -->
  <text x="1100" y="610" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>