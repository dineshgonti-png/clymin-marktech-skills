<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="de-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="de-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#de-bg)"/>

  <!-- Background binary/data texture -->
  <g opacity="0.04" font-family="monospace" font-size="10" fill="#FFFFFF">
    <text x="50" y="80">01001 10110 01101 00101 11010</text>
    <text x="200" y="120">10110 01001 11010 10010 01101</text>
    <text x="100" y="160">01101 11001 00110 10101 01010</text>
    <text x="300" y="200">10010 01110 11001 01011 10100</text>
    <text x="50" y="480">01001 10110 01101 00101 11010</text>
    <text x="200" y="520">10110 01001 11010 10010 01101</text>
    <text x="100" y="560">01101 11001 00110 10101 01010</text>
  </g>

  <!-- Question mark made of data elements -->
  <g transform="translate(850, 280)">
    <!-- Main question mark path with data dots -->
    <!-- Top curve of ? -->
    <circle cx="-10" cy="-120" r="6" fill="#FF6B35" opacity="0.9"/>
    <circle cx="10" cy="-135" r="5" fill="#FF6B35" opacity="0.8"/>
    <circle cx="30" cy="-142" r="6" fill="#FFD166" opacity="0.9"/>
    <circle cx="52" cy="-140" r="5" fill="#FF6B35" opacity="0.7"/>
    <circle cx="70" cy="-130" r="6" fill="#FFD166" opacity="0.8"/>
    <circle cx="80" cy="-115" r="5" fill="#FF6B35" opacity="0.9"/>
    <circle cx="82" cy="-95" r="6" fill="#FFD166" opacity="0.7"/>
    <circle cx="75" cy="-75" r="5" fill="#FF6B35" opacity="0.8"/>
    <circle cx="60" cy="-60" r="6" fill="#FFD166" opacity="0.9"/>
    <circle cx="42" cy="-48" r="5" fill="#FF6B35" opacity="0.7"/>
    <circle cx="35" cy="-30" r="6" fill="#FF6B35" opacity="0.8"/>
    <circle cx="35" cy="-10" r="5" fill="#FFD166" opacity="0.9"/>
    <!-- Dot of ? -->
    <circle cx="35" cy="30" r="10" fill="#FF6B35"/>
    <circle cx="35" cy="30" r="5" fill="#FFD166"/>

    <!-- Data element labels on some dots -->
    <rect x="90" cy="-100" y="-108" width="55" height="18" rx="3" fill="#FF6B35" opacity="0.15"/>
    <text x="117" y="-95" font-family="monospace" font-size="9" fill="#FF6B35" text-anchor="middle">price</text>
    <line x1="82" y1="-95" x2="90" y2="-100" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>

    <rect x="90" y="-68" width="55" height="18" rx="3" fill="#FFD166" opacity="0.15"/>
    <text x="117" y="-55" font-family="monospace" font-size="9" fill="#FFD166" text-anchor="middle">title</text>
    <line x1="60" y1="-60" x2="90" y2="-60" stroke="#FFD166" stroke-width="0.5" opacity="0.3"/>

    <rect x="-70" y="-148" width="55" height="18" rx="3" fill="#FF6B35" opacity="0.15"/>
    <text x="-42" y="-135" font-family="monospace" font-size="9" fill="#FF6B35" text-anchor="middle">sku</text>
    <line x1="-15" y1="-135" x2="-10" y2="-120" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Raw webpage shape (left side, middle) -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="180" height="220" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <!-- Browser bar -->
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
    <circle cx="16" cy="12" r="4" fill="#FF6B35" opacity="0.5"/>
    <circle cx="30" cy="12" r="4" fill="#FFD166" opacity="0.5"/>
    <circle cx="44" cy="12" r="4" fill="#FFFFFF" opacity="0.2"/>
    <!-- Content lines (messy/raw) -->
    <rect x="15" y="40" width="150" height="8" rx="2" fill="#FFFFFF" opacity="0.12"/>
    <rect x="15" y="55" width="120" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <rect x="15" y="70" width="140" height="8" rx="2" fill="#FFFFFF" opacity="0.1"/>
    <rect x="15" y="90" width="60" height="30" rx="3" fill="#FFFFFF" opacity="0.06"/>
    <rect x="85" y="90" width="80" height="8" rx="2" fill="#FFFFFF" opacity="0.1"/>
    <rect x="85" y="105" width="60" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <rect x="15" y="135" width="150" height="8" rx="2" fill="#FFFFFF" opacity="0.1"/>
    <rect x="15" y="150" width="100" height="8" rx="2" fill="#FFFFFF" opacity="0.08"/>
    <rect x="15" y="170" width="70" height="24" rx="4" fill="#FF6B35" opacity="0.15"/>
    <rect x="95" y="170" width="70" height="24" rx="4" fill="#FFFFFF" opacity="0.06"/>
    <text x="90" y="-10" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.35" text-anchor="middle">RAW PAGE</text>
  </g>

  <!-- Transformation arrow -->
  <g transform="translate(320, 380)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="url(#de-flow)" stroke-width="3" stroke-dasharray="8,4"/>
    <polygon points="100,0 88,-8 88,8" fill="#FFD166"/>
    <!-- Gear on the arrow -->
    <g transform="translate(50, 0)" opacity="0.6">
      <circle cx="0" cy="0" r="14" fill="#1a1a2e" stroke="#FF6B35" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#FF6B35" stroke-width="1"/>
      <line x1="0" y1="-14" x2="0" y2="-18" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="0" y2="18" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="-18" y2="0" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="0" x2="18" y2="0" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Structured table (right of arrow) -->
  <g transform="translate(450, 290)">
    <rect x="0" y="0" width="220" height="180" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FF6B35" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Header row -->
    <rect x="0" y="0" width="220" height="30" rx="6" fill="#FF6B35" fill-opacity="0.15"/>
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#FF6B35">Name</text>
    <text x="85" y="20" font-family="monospace" font-size="10" fill="#FF6B35">Price</text>
    <text x="145" y="20" font-family="monospace" font-size="10" fill="#FF6B35">Stock</text>
    <!-- Divider lines -->
    <line x1="75" y1="5" x2="75" y2="175" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <line x1="138" y1="5" x2="138" y2="175" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <!-- Row 1 -->
    <rect x="15" y="42" width="50" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <text x="95" y="50" font-family="monospace" font-size="10" fill="#FFD166">$49.99</text>
    <circle cx="160" cy="46" r="4" fill="#4ade80" opacity="0.6"/>
    <!-- Row 2 -->
    <rect x="15" y="72" width="45" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <text x="95" y="80" font-family="monospace" font-size="10" fill="#FFD166">$34.50</text>
    <circle cx="160" cy="76" r="4" fill="#4ade80" opacity="0.6"/>
    <!-- Row 3 -->
    <rect x="15" y="102" width="55" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <text x="95" y="110" font-family="monospace" font-size="10" fill="#FFD166">$72.00</text>
    <circle cx="160" cy="106" r="4" fill="#FF6B35" opacity="0.6"/>
    <!-- Row 4 -->
    <rect x="15" y="132" width="40" height="8" rx="2" fill="#FFFFFF" opacity="0.2"/>
    <text x="95" y="140" font-family="monospace" font-size="10" fill="#FFD166">$19.95</text>
    <circle cx="160" cy="136" r="4" fill="#4ade80" opacity="0.6"/>
    <!-- Row lines -->
    <line x1="5" y1="60" x2="215" y2="60" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <line x1="5" y1="90" x2="215" y2="90" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <line x1="5" y1="120" x2="215" y2="120" stroke="#FFFFFF" stroke-opacity="0.04"/>
    <line x1="5" y1="150" x2="215" y2="150" stroke="#FFFFFF" stroke-opacity="0.04"/>

    <text x="110" y="-10" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FF6B35" opacity="0.6" text-anchor="middle">STRUCTURED DATA</text>
  </g>

  <!-- Floating extraction particles between webpage and table -->
  <g opacity="0.4">
    <rect x="330" y="320" width="20" height="6" rx="1" fill="#FFD166">
      <animate attributeName="x" values="280;420" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="310" y="360" width="16" height="6" rx="1" fill="#FF6B35">
      <animate attributeName="x" values="280;420" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="440" width="18" height="6" rx="1" fill="#FFD166">
      <animate attributeName="x" values="280;420" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner accents -->
  <g opacity="0.12">
    <rect x="30" y="30" width="70" height="2" fill="#FFD166"/>
    <rect x="30" y="30" width="2" height="70" fill="#FFD166"/>
    <rect x="1100" y="30" width="70" height="2" fill="#FF6B35"/>
    <rect x="1168" y="30" width="2" height="70" fill="#FF6B35"/>
  </g>

  <!-- Title text -->
  <text x="80" y="130" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">What Is Data</text>
  <text x="80" y="195" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFD166" letter-spacing="-1">Extraction?</text>

  <!-- Subtitle -->
  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" letter-spacing="3">PRODUCT DATA GUIDE</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>