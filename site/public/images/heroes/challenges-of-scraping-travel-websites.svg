<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Travel Scraping Challenges</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Navigating anti-bot defenses and data protection barriers</text>
  <!-- Shield / Firewall center -->
  <path d="M600,180 L660,210 L660,300 C660,360 600,400 600,400 C600,400 540,360 540,300 L540,210 Z" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
  <path d="M600,200 L640,220 L640,290 C640,340 600,370 600,370 C600,370 560,340 560,290 L560,220 Z" fill="#FF6B35" opacity="0.12"/>
  <text x="600" y="295" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#FF6B35" text-anchor="middle" opacity="0.8">403</text>
  <!-- Warning triangles left -->
  <polygon points="180,250 200,215 220,250" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <text x="200" y="246" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.7">!</text>
  <polygon points="120,340 140,305 160,340" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <text x="140" y="336" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.5">!</text>
  <polygon points="230,380 250,345 270,380" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <text x="250" y="376" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.6">!</text>
  <!-- Warning triangles right -->
  <polygon points="980,250 1000,215 1020,250" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.7"/>
  <text x="1000" y="246" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.7">!</text>
  <polygon points="1040,340 1060,305 1080,340" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <text x="1060" y="336" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.5">!</text>
  <polygon points="930,390 950,355 970,390" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <text x="950" y="386" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FF6B35" text-anchor="middle" opacity="0.6">!</text>
  <!-- Broken connection lines left side -->
  <line x1="80" y1="220" x2="300" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,6"/>
  <line x1="80" y1="300" x2="280" y2="310" stroke="#FF6B35" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,6"/>
  <line x1="100" y1="400" x2="320" y2="360" stroke="#FF6B35" stroke-width="1.5" opacity="0.35" stroke-dasharray="8,6"/>
  <!-- Broken X marks on lines -->
  <text x="190" y="240" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.6">x</text>
  <text x="180" y="310" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.5">x</text>
  <text x="210" y="385" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.5">x</text>
  <!-- Broken connection lines right side -->
  <line x1="900" y1="250" x2="1120" y2="220" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,6"/>
  <line x1="920" y1="310" x2="1120" y2="300" stroke="#FF6B35" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,6"/>
  <line x1="880" y1="370" x2="1100" y2="400" stroke="#FF6B35" stroke-width="1.5" opacity="0.35" stroke-dasharray="8,6"/>
  <text x="1010" y="240" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.6">x</text>
  <text x="1020" y="310" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.5">x</text>
  <text x="990" y="390" font-family="Inter, sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle" opacity="0.5">x</text>
  <!-- Wall barriers left -->
  <rect x="320" y="180" width="8" height="280" rx="2" fill="#FF6B35" opacity="0.25"/>
  <rect x="340" y="200" width="8" height="250" rx="2" fill="#FF6B35" opacity="0.18"/>
  <rect x="360" y="220" width="8" height="220" rx="2" fill="#FF6B35" opacity="0.12"/>
  <!-- Wall barriers right -->
  <rect x="830" y="180" width="8" height="280" rx="2" fill="#FF6B35" opacity="0.25"/>
  <rect x="850" y="200" width="8" height="250" rx="2" fill="#FF6B35" opacity="0.18"/>
  <rect x="870" y="220" width="8" height="220" rx="2" fill="#FF6B35" opacity="0.12"/>
  <!-- Anti-bot labels -->
  <rect x="420" y="440" width="140" height="32" rx="6" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1"/>
  <text x="490" y="461" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.7">CAPTCHA</text>
  <rect x="590" y="440" width="140" height="32" rx="6" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1"/>
  <text x="660" y="461" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.7">Rate Limiting</text>
  <rect x="760" y="440" width="140" height="32" rx="6" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1"/>
  <text x="830" y="461" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.7">IP Blocking</text>
  <rect x="250" y="440" width="140" height="32" rx="6" fill="#FF6B35" opacity="0.15" stroke="#FF6B35" stroke-width="1"/>
  <text x="320" y="461" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.7">JS Rendering</text>
  <!-- Floating data particles -->
  <circle cx="450" cy="200" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="500" cy="350" r="2.5" fill="#FF6B35" opacity="0.4"/>
  <circle cx="700" cy="200" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="750" cy="360" r="2.5" fill="#FF6B35" opacity="0.4"/>
  <circle cx="480" cy="280" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="720" cy="280" r="2" fill="#ffffff" opacity="0.3"/>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>