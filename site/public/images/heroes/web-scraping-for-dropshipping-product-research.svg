<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#1a2a3e"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad4)"/>

  <!-- Hexagon grid pattern -->
  <g opacity="0.04" stroke="#FFD166" stroke-width="1" fill="none">
    <polygon points="750,50 780,35 810,50 810,80 780,95 750,80"/>
    <polygon points="810,50 840,35 870,50 870,80 840,95 810,80"/>
    <polygon points="870,50 900,35 930,50 930,80 900,95 870,80"/>
    <polygon points="780,95 810,80 840,95 840,125 810,140 780,125"/>
    <polygon points="840,95 870,80 900,95 900,125 870,140 840,125"/>
    <polygon points="900,95 930,80 960,95 960,125 930,140 900,125"/>
    <polygon points="750,140 780,125 810,140 810,170 780,185 750,170"/>
    <polygon points="810,140 840,125 870,140 870,170 840,185 810,170"/>
  </g>

  <!-- Shipping box 1 -->
  <g transform="translate(720, 160)">
    <rect x="0" y="15" width="70" height="55" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
    <polygon points="0,15 35,0 105,0 70,15" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>
    <polygon points="70,15 105,0 105,55 70,70" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
    <!-- Box tape -->
    <line x1="35" y1="15" x2="35" y2="70" stroke="#FFD166" stroke-width="1" opacity="0.4"/>
    <line x1="35" y1="15" x2="70" y2="0" stroke="#FFD166" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Shipping box 2 (smaller, offset) -->
  <g transform="translate(850, 140)">
    <rect x="0" y="12" width="55" height="43" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.4"/>
    <polygon points="0,12 28,0 83,0 55,12" fill="none" stroke="#FFD166" stroke-width="1" opacity="0.35"/>
    <polygon points="55,12 83,0 83,43 55,55" fill="none" stroke="#FFD166" stroke-width="1" opacity="0.3"/>
    <line x1="28" y1="12" x2="28" y2="55" stroke="#FF6B35" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(940, 200)" opacity="0.45">
    <circle cx="35" cy="35" r="30" fill="none" stroke="#FF6B35" stroke-width="3"/>
    <circle cx="35" cy="35" r="22" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.3"/>
    <line x1="56" y1="56" x2="80" y2="80" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <!-- Shine -->
    <path d="M22,22 Q28,16 34,22" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Discovery funnel -->
  <g transform="translate(780, 300)">
    <!-- Funnel shape -->
    <polygon points="0,0 250,0 200,40 50,40" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.4"/>
    <polygon points="50,40 200,40 170,80 80,80" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.35"/>
    <polygon points="80,80 170,80 145,120 105,120" fill="none" stroke="#FFD166" stroke-width="1.5" opacity="0.3"/>
    <!-- Items flowing into funnel -->
    <circle cx="40" cy="-15" r="6" fill="#FF6B35" opacity="0.4"/>
    <circle cx="80" cy="-20" r="5" fill="#FFD166" opacity="0.35"/>
    <circle cx="120" cy="-12" r="7" fill="#FF6B35" opacity="0.3"/>
    <circle cx="160" cy="-18" r="5" fill="#FFD166" opacity="0.4"/>
    <circle cx="200" cy="-14" r="6" fill="#FF6B35" opacity="0.35"/>
    <!-- Output arrow -->
    <line x1="125" y1="120" x2="125" y2="155" stroke="#FFD166" stroke-width="2" opacity="0.4"/>
    <polygon points="125,160 118,150 132,150" fill="#FFD166" opacity="0.4"/>
    <!-- Result item -->
    <rect x="110" y="165" width="30" height="20" rx="3" fill="#FF6B35" opacity="0.3" stroke="#FF6B35" stroke-width="1"/>
  </g>

  <!-- Marketplace icons flowing -->
  <g opacity="0.2">
    <!-- Marketplace 1 -->
    <rect x="680" y="270" width="30" height="30" rx="6" fill="none" stroke="#FFD166" stroke-width="1.5"/>
    <line x1="710" y1="285" x2="750" y2="300" stroke="#FFD166" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Marketplace 2 -->
    <rect x="1070" y="260" width="30" height="30" rx="6" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <line x1="1070" y1="275" x2="1040" y2="295" stroke="#FF6B35" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Marketplace 3 -->
    <rect x="680" y="340" width="30" height="30" rx="6" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <line x1="710" y1="355" x2="750" y2="345" stroke="#FF6B35" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Marketplace 4 -->
    <rect x="1080" y="330" width="30" height="30" rx="6" fill="none" stroke="#FFD166" stroke-width="1.5"/>
    <line x1="1080" y1="345" x2="1040" y2="340" stroke="#FFD166" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- Floating data particles -->
  <circle cx="700" cy="500" r="2" fill="#FF6B35" opacity="0.3"/>
  <circle cx="800" cy="530" r="3" fill="#FFD166" opacity="0.25"/>
  <circle cx="950" cy="500" r="2" fill="#FF6B35" opacity="0.3"/>
  <circle cx="1100" cy="480" r="3" fill="#FFD166" opacity="0.2"/>
  <circle cx="1050" cy="540" r="2" fill="#FF6B35" opacity="0.25"/>

  <!-- Decorative triangle -->
  <polygon points="1150,0 1200,0 1200,80" fill="#FF6B35" opacity="0.05"/>
  <polygon points="0,630 80,630 0,560" fill="#FFD166" opacity="0.04"/>

  <!-- Left accent bar -->
  <rect x="60" y="180" width="4" height="120" rx="2" fill="#FF6B35" opacity="0.6"/>

  <!-- Title text -->
  <text x="80" y="240" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Dropshipping</text>
  <text x="80" y="300" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Research</text>

  <!-- Subtitle -->
  <text x="80" y="345" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" opacity="0.5">Product Discovery &amp; Market Analysis</text>

  <!-- Orange accent line -->
  <rect x="80" y="360" width="180" height="3" rx="1.5" fill="#FF6B35"/>

  <!-- Brand text bottom-right -->
  <text x="1140" y="600" fill="#FF6B35" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="end">Clymin</text>
</svg>