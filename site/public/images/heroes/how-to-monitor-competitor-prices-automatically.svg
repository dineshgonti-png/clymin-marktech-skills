<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="mp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#mp-bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.06" fill="#FFFFFF">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="200" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/>
    <circle cx="50" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="250" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="200" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="300" cy="150" r="1.5"/>
    <circle cx="900" cy="50" r="1.5"/><circle cx="950" cy="50" r="1.5"/><circle cx="1000" cy="50" r="1.5"/><circle cx="1050" cy="50" r="1.5"/><circle cx="1100" cy="50" r="1.5"/><circle cx="1150" cy="50" r="1.5"/>
    <circle cx="900" cy="100" r="1.5"/><circle cx="950" cy="100" r="1.5"/><circle cx="1000" cy="100" r="1.5"/><circle cx="1050" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/><circle cx="1150" cy="100" r="1.5"/>
  </g>

  <!-- Price display cards -->
  <!-- Card 1 -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#mp-card)" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.4"/>
    <text x="15" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">COMPETITOR A</text>
    <text x="15" y="65" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFD166">$49.99</text>
    <rect x="15" y="78" width="60" height="4" rx="2" fill="#FF6B35" opacity="0.5"/>
    <!-- Live dot -->
    <circle cx="140" cy="20" r="4" fill="#4ade80" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 2 -->
  <g transform="translate(810, 120)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#mp-card)" stroke="#FFD166" stroke-width="1" stroke-opacity="0.3"/>
    <text x="15" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">COMPETITOR B</text>
    <text x="15" y="65" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FF6B35">$52.50</text>
    <rect x="15" y="78" width="45" height="4" rx="2" fill="#FFD166" opacity="0.5"/>
    <circle cx="140" cy="20" r="4" fill="#4ade80" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1000, 160)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#mp-card)" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.3"/>
    <text x="15" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.5">COMPETITOR C</text>
    <text x="15" y="65" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" opacity="0.8">$47.00</text>
    <rect x="15" y="78" width="80" height="4" rx="2" fill="#FF6B35" opacity="0.5"/>
    <circle cx="140" cy="20" r="4" fill="#4ade80" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Circular sync arrows -->
  <g transform="translate(870, 360)" opacity="0.7">
    <!-- Outer circle track -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4"/>
    <!-- Arrow path 1 -->
    <path d="M-60-35 A70 70 0 0 1 60-35" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="60,-35 50,-45 55,-30" fill="#FF6B35"/>
    <!-- Arrow path 2 -->
    <path d="M60 35 A70 70 0 0 1 -60 35" fill="none" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-60,35 -50,45 -55,30" fill="#FFD166"/>
    <!-- Center icon -->
    <circle cx="0" cy="0" r="20" fill="#FF6B35" opacity="0.15"/>
    <text x="0" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#FF6B35" text-anchor="middle" font-weight="700">&#x21BB;</text>
  </g>

  <!-- Automation gears -->
  <g transform="translate(700, 440)" opacity="0.4">
    <!-- Gear 1 -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FFD166" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFD166" stroke-width="2"/>
    <line x1="0" y1="-25" x2="0" y2="-30" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="25" x2="0" y2="30" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="-25" y1="0" x2="-30" y2="0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="-18" x2="-21" y2="-21" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="21" y2="21" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="21" y2="-21" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="18" x2="-21" y2="21" stroke="#FFD166" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(745, 475)" opacity="0.25">
    <!-- Gear 2 (smaller) -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#FF6B35" stroke-width="2"/>
    <line x1="0" y1="-16" x2="0" y2="-20" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="0" y2="20" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="-20" y2="0" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="0" x2="20" y2="0" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Dashboard mini chart -->
  <g transform="translate(620, 290)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="url(#mp-card)" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <polyline points="15,60 40,50 65,55 90,35 115,40 140,25 165,30 185,15" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
    <circle cx="185" cy="15" r="3" fill="#FF6B35"/>
    <text x="15" y="20" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.4">LIVE FEED</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#FF6B35" stroke-width="1" opacity="0.15" stroke-dasharray="4,6">
    <line x1="780" y1="190" x2="810" y2="170"/>
    <line x1="780" y1="240" x2="620" y2="290"/>
    <line x1="970" y1="210" x2="1000" y2="210"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.12">
    <rect x="30" y="30" width="60" height="2" fill="#FF6B35"/>
    <rect x="30" y="30" width="2" height="60" fill="#FF6B35"/>
    <rect x="1110" y="30" width="60" height="2" fill="#FFD166"/>
    <rect x="1168" y="30" width="2" height="60" fill="#FFD166"/>
    <rect x="30" y="598" width="60" height="2" fill="#FFD166"/>
    <rect x="30" y="540" width="2" height="60" fill="#FFD166"/>
  </g>

  <!-- Title text -->
  <text x="80" y="170" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Monitor Competitor</text>
  <text x="80" y="235" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FF6B35" letter-spacing="-1">Prices</text>

  <!-- Subtitle -->
  <text x="80" y="280" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.4" letter-spacing="3">AUTOMATED TRACKING</text>

  <!-- Small tag line -->
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFD166" opacity="0.5">Real-time price intelligence</text>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>