<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title -->
  <text x="600" y="55" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">Airbnb Data Extraction</text>
  <text x="600" y="100" font-family="Inter, sans-serif" font-weight="400" font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.6">Property listings transformed into structured datasets</text>
  <!-- Property card 1 -->
  <rect x="80" y="160" width="220" height="190" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <rect x="90" y="170" width="200" height="80" rx="6" fill="#FF6B35" opacity="0.1"/>
  <text x="190" y="215" font-family="Inter, sans-serif" font-size="20" fill="#FF6B35" text-anchor="middle" opacity="0.3">&#9751;</text>
  <text x="100" y="275" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">Cozy Downtown Loft</text>
  <!-- Data point tags on card 1 -->
  <rect x="100" y="290" width="55" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="127" y="303" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">$127/nt</text>
  <rect x="162" y="290" width="35" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="180" y="303" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">4.8&#9733;</text>
  <rect x="204" y="290" width="50" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="229" y="303" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">&#9906; NYC</text>
  <text x="100" y="335" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Entire apartment - 2 guests</text>
  <!-- Property card 2 -->
  <rect x="80" y="370" width="220" height="170" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.2"/>
  <rect x="90" y="380" width="200" height="70" rx="6" fill="#FF6B35" opacity="0.1"/>
  <text x="190" y="420" font-family="Inter, sans-serif" font-size="20" fill="#FF6B35" text-anchor="middle" opacity="0.3">&#9751;</text>
  <text x="100" y="475" font-family="Inter, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">Beachfront Villa</text>
  <rect x="100" y="488" width="55" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="127" y="501" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">$312/nt</text>
  <rect x="162" y="488" width="35" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="180" y="501" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">4.9&#9733;</text>
  <rect x="204" y="488" width="55" height="18" rx="4" fill="#FF6B35" opacity="0.2"/>
  <text x="232" y="501" font-family="Inter, sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle">&#9906; Miami</text>
  <text x="100" y="525" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Entire villa - 6 guests</text>
  <!-- Extraction arrows from data points -->
  <line x1="300" y1="300" x2="500" y2="250" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>
  <line x1="300" y1="330" x2="500" y2="300" stroke="#FF6B35" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,4"/>
  <line x1="300" y1="490" x2="500" y2="380" stroke="#FF6B35" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>
  <line x1="300" y1="520" x2="500" y2="420" stroke="#FF6B35" stroke-width="1.5" opacity="0.35" stroke-dasharray="5,4"/>
  <!-- Floating data particles -->
  <circle cx="350" cy="280" r="2.5" fill="#FF6B35" opacity="0.5"/>
  <circle cx="400" cy="340" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="420" cy="400" r="2.5" fill="#FF6B35" opacity="0.45"/>
  <circle cx="380" cy="450" r="2" fill="#FF6B35" opacity="0.4"/>
  <circle cx="460" cy="300" r="3" fill="#FF6B35" opacity="0.55"/>
  <!-- Central transform indicator -->
  <rect x="490" y="280" width="80" height="80" rx="40" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <text x="530" y="325" font-family="Inter, sans-serif" font-size="20" fill="#FF6B35" text-anchor="middle" opacity="0.7">&#8644;</text>
  <!-- Arrow to structured table -->
  <line x1="570" y1="320" x2="640" y2="320" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  <polygon points="640,315 650,320 640,325" fill="#FF6B35" opacity="0.5"/>
  <!-- Structured table output (right side) -->
  <rect x="650" y="150" width="460" height="380" rx="10" fill="#16213e" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="880" y="182" font-family="Inter, sans-serif" font-size="13" fill="#FF6B35" text-anchor="middle" font-weight="700">Structured Dataset</text>
  <line x1="670" y1="195" x2="1090" y2="195" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <!-- Column headers -->
  <text x="690" y="218" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.8" font-weight="700">Title</text>
  <text x="810" y="218" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.8" font-weight="700">Price</text>
  <text x="870" y="218" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.8" font-weight="700">Rating</text>
  <text x="930" y="218" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.8" font-weight="700">Location</text>
  <text x="1020" y="218" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.8" font-weight="700">Type</text>
  <line x1="670" y1="228" x2="1090" y2="228" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <!-- Data rows -->
  <text x="690" y="248" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.6">Cozy Downtown Loft</text>
  <text x="810" y="248" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.7">$127</text>
  <text x="870" y="248" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">4.8</text>
  <text x="930" y="248" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">New York</text>
  <text x="1020" y="248" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Apartment</text>
  <line x1="670" y1="258" x2="1090" y2="258" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="690" y="278" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.6">Beachfront Villa</text>
  <text x="810" y="278" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.7">$312</text>
  <text x="870" y="278" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">4.9</text>
  <text x="930" y="278" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Miami</text>
  <text x="1020" y="278" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Villa</text>
  <line x1="670" y1="288" x2="1090" y2="288" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="690" y="308" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Mountain Cabin</text>
  <text x="810" y="308" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.6">$198</text>
  <text x="870" y="308" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">4.7</text>
  <text x="930" y="308" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Aspen</text>
  <text x="1020" y="308" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Cabin</text>
  <line x1="670" y1="318" x2="1090" y2="318" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="690" y="338" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Studio Near Park</text>
  <text x="810" y="338" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.6">$89</text>
  <text x="870" y="338" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">4.5</text>
  <text x="930" y="338" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Chicago</text>
  <text x="1020" y="338" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Studio</text>
  <line x1="670" y1="348" x2="1090" y2="348" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="690" y="368" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.5">Luxury Penthouse</text>
  <text x="810" y="368" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.6">$475</text>
  <text x="870" y="368" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">4.9</text>
  <text x="930" y="368" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">LA</text>
  <text x="1020" y="368" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Penthouse</text>
  <line x1="670" y1="378" x2="1090" y2="378" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <text x="690" y="398" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.4">Treehouse Retreat</text>
  <text x="810" y="398" font-family="Inter, sans-serif" font-size="10" fill="#FF6B35" opacity="0.5">$165</text>
  <text x="870" y="398" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.35">4.6</text>
  <text x="930" y="398" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.35">Portland</text>
  <text x="1020" y="398" font-family="Inter, sans-serif" font-size="10" fill="#ffffff" opacity="0.35">Treehouse</text>
  <!-- Record count -->
  <text x="880" y="505" font-family="Inter, sans-serif" font-size="12" fill="#FF6B35" text-anchor="middle" opacity="0.6">12,450 listings extracted</text>
  <!-- Clymin branding -->
  <text x="1150" y="600" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="end">Clymin</text>
</svg>