<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="sf-data" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sf-bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sf-sky)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Golden Gate Bridge hint -->
  <g opacity="0.7">
    <!-- Left tower -->
    <rect x="250" y="320" width="12" height="160" fill="#FF6B35" rx="2"/>
    <!-- Right tower -->
    <rect x="500" y="300" width="12" height="180" fill="#FF6B35" rx="2"/>
    <!-- Suspension cables -->
    <path d="M256 320 Q380 380 506 300" fill="none" stroke="url(#sf-bridge)" stroke-width="3"/>
    <path d="M256 330 Q380 390 506 310" fill="none" stroke="url(#sf-bridge)" stroke-width="2"/>
    <!-- Road deck -->
    <rect x="250" y="470" width="262" height="6" fill="#FF6B35" opacity="0.5" rx="1"/>
    <!-- Vertical cables -->
    <line x1="300" y1="350" x2="300" y2="470" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
    <line x1="350" y1="365" x2="350" y2="470" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
    <line x1="400" y1="370" x2="400" y2="470" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
    <line x1="450" y1="360" x2="450" y2="470" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- City skyline silhouette -->
  <g opacity="0.3">
    <rect x="600" y="380" width="40" height="120" fill="#FFFFFF" rx="2"/>
    <rect x="650" y="340" width="35" height="160" fill="#FFFFFF" rx="2"/>
    <rect x="695" y="370" width="50" height="130" fill="#FFFFFF" rx="2"/>
    <rect x="755" y="310" width="30" height="190" fill="#FFFFFF" rx="2"/>
    <rect x="795" y="360" width="45" height="140" fill="#FFFFFF" rx="2"/>
    <rect x="850" y="390" width="35" height="110" fill="#FFFFFF" rx="2"/>
    <rect x="895" y="350" width="40" height="150" fill="#FFFFFF" rx="2"/>
    <rect x="945" y="400" width="30" height="100" fill="#FFFFFF" rx="2"/>
    <rect x="985" y="370" width="45" height="130" fill="#FFFFFF" rx="2"/>
    <rect x="1040" y="410" width="35" height="90" fill="#FFFFFF" rx="2"/>
  </g>

  <!-- Data streams rising from buildings -->
  <g opacity="0.6">
    <circle cx="620" cy="360" r="4" fill="#FFD166">
      <animate attributeName="cy" values="360;280;200;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="668" cy="320" r="3" fill="#FF6B35">
      <animate attributeName="cy" values="320;250;180;100" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="350" r="5" fill="#FFD166">
      <animate attributeName="cy" values="350;270;190;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="290" r="3" fill="#FF6B35">
      <animate attributeName="cy" values="290;220;150;80" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="818" cy="340" r="4" fill="#FFD166">
      <animate attributeName="cy" values="340;260;180;100" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="915" cy="330" r="3" fill="#FF6B35">
      <animate attributeName="cy" values="330;250;170;90" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;0.3;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dotted data stream lines -->
  <g stroke="#FFD166" stroke-width="1" stroke-dasharray="3,6" opacity="0.3">
    <line x1="620" y1="380" x2="620" y2="120"/>
    <line x1="720" y1="370" x2="720" y2="100"/>
    <line x1="818" y1="360" x2="818" y2="90"/>
    <line x1="915" y1="350" x2="915" y2="80"/>
  </g>

  <!-- Location pin icon -->
  <g transform="translate(100, 340)">
    <path d="M0-40 C-22-40 -40-22 -40 0 C-40 25 0 60 0 60 C0 60 40 25 40 0 C40-22 22-40 0-40Z" fill="#FF6B35" opacity="0.9"/>
    <circle cx="0" cy="-2" r="14" fill="#1a1a2e"/>
    <circle cx="0" cy="-2" r="6" fill="#FFD166"/>
  </g>

  <!-- Decorative corner elements -->
  <g opacity="0.15">
    <rect x="30" y="30" width="80" height="2" fill="#FF6B35"/>
    <rect x="30" y="30" width="2" height="80" fill="#FF6B35"/>
    <rect x="1090" y="30" width="80" height="2" fill="#FFD166"/>
    <rect x="1168" y="30" width="2" height="80" fill="#FFD166"/>
  </g>

  <!-- Floating data dots background -->
  <g opacity="0.15">
    <circle cx="150" cy="150" r="3" fill="#FFD166"/>
    <circle cx="300" cy="100" r="2" fill="#FF6B35"/>
    <circle cx="450" cy="180" r="4" fill="#FFD166"/>
    <circle cx="550" cy="120" r="2" fill="#FF6B35"/>
    <circle cx="700" cy="80" r="3" fill="#FFD166"/>
    <circle cx="900" cy="140" r="2" fill="#FF6B35"/>
    <circle cx="1050" cy="100" r="3" fill="#FFD166"/>
    <circle cx="1100" cy="200" r="2" fill="#FF6B35"/>
  </g>

  <!-- Title text -->
  <text x="100" y="160" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Price Scraping</text>
  <text x="100" y="220" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
    <tspan fill="#FF6B35">&#x2014;</tspan> San Francisco
  </text>

  <!-- Subtitle -->
  <text x="100" y="265" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.5" letter-spacing="3" text-transform="uppercase">ECOMMERCE INTELLIGENCE</text>

  <!-- Ground line -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#FF6B35" stroke-width="1" opacity="0.2"/>

  <!-- Clymin brand -->
  <text x="1140" y="600" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#FF6B35" text-anchor="end" letter-spacing="2">Clymin</text>
</svg>