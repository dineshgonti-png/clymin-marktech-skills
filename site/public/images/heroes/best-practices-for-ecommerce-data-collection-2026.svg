  <rect x="724" y="386" width="24" height="24" rx="5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <rect x="762" y="392" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.12"/>

