  <circle cx="160" cy="140" r="4" fill="#FF6B35" opacity="0.5"/>
  <circle cx="220" cy="180" r="3" fill="#FFD166" opacity="0.4"/>
  <circle cx="140" cy="220" r="5" fill="#FF6B35" opacity="0.3"/>
  <circle cx="280" cy="160" r="3" fill="#FFFFFF" opacity="0.2"/>
  <line x1="160" y1="140" x2="220" y2="180" stroke="#FF6B35" stroke-width="1" opacity="0.15"/>
  <line x1="220" y1="180" x2="140" y2="220" stroke="#FFD166" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="140" x2="280" y2="160" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

