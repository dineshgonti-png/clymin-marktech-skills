  <rect x="710" y="308" width="370" height="52" rx="8" fill="#FFFFFF" opacity="0.06"/>
  <rect x="724" y="322" width="24" height="24" rx="5" fill="#FF6B35" opacity="0.9"/>
  <polyline points="730,335 736,341 744,329" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="762" y="328" width="200" height="10" rx="5" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="1050" cy="334" r="10" fill="#FF6B35" opacity="0.2"/>

