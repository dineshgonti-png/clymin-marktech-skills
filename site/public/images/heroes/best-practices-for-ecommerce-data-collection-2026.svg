  <polygon points="180,450 200,438 220,450 220,472 200,484 180,472" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.12"/>
  <polygon points="220,490 240,478 260,490 260,512 240,524 220,512" fill="none" stroke="#FFD166" stroke-width="1" opacity="0.08"/>

